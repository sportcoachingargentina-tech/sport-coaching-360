<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi Perfil — Sport Coaching 360</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#060d1a;color:#e8eff8;min-height:100vh}

    .header{background:#0d1b3e;border-bottom:2px solid #1a3a6e;padding:14px 20px;display:flex;align-items:center;gap:12px}
    .header-logo{font-size:22px}
    .header-title{font-size:14px;font-weight:700;color:#00c2ff;letter-spacing:0.05em}
    .header-sub{font-size:11px;color:#4a6280;margin-top:1px}

    .container{max-width:480px;margin:0 auto;padding:16px}

    /* Card jugador */
    .player-card{background:#0d1b3e;border:1px solid #1a3a6e;border-radius:16px;padding:20px;margin-bottom:16px;text-align:center}
    .player-avatar{width:64px;height:64px;border-radius:50%;background:#1a3a6e;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#00c2ff;margin:0 auto 12px}
    .player-name{font-size:22px;font-weight:800;color:#fff;margin-bottom:4px}
    .player-info{font-size:12px;color:#8fa3bf}

    /* MDC grande */
    .mdc-card{background:#0d1b3e;border-radius:16px;padding:20px;margin-bottom:16px;text-align:center;border:2px solid transparent}
    .mdc-card.verde{border-color:#22c55e}
    .mdc-card.amarillo{border-color:#f59e0b}
    .mdc-card.rojo{border-color:#ef4444}
    .mdc-label{font-size:10px;font-weight:700;color:#4a6280;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px}
    .mdc-valor{font-size:64px;font-weight:900;line-height:1}
    .mdc-semaforo{font-size:13px;font-weight:700;margin-top:6px;letter-spacing:0.05em}
    .mdc-formula{font-size:11px;color:#4a6280;margin-top:8px;font-style:italic}
    .mdc-barra{height:10px;background:#1a3a6e;border-radius:8px;overflow:hidden;margin-top:12px}
    .mdc-barra-fill{height:100%;border-radius:8px;transition:width 1.2s ease}

    /* Modo motivacional */
    .modo-card{background:#0d1b3e;border-radius:16px;padding:16px;margin-bottom:16px}
    .modo-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .modo-icon{font-size:28px}
    .modo-titulo{font-size:14px;font-weight:800}
    .modo-sub{font-size:11px;color:#8fa3bf;margin-top:1px}
    .modo-desc{font-size:12px;color:#c0d0e8;line-height:1.5;margin-bottom:10px}
    .modo-frase{font-size:13px;font-style:italic;font-weight:600;padding:10px 14px;border-radius:8px;text-align:center}

    /* Dimensiones */
    .dims-card{background:#0d1b3e;border-radius:16px;padding:16px;margin-bottom:16px}
    .dims-titulo{font-size:11px;font-weight:700;color:#4a6280;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:12px}
    .dim-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .dim-name{font-size:12px;color:#e8eff8;width:130px;flex-shrink:0}
    .dim-barra{flex:1;height:7px;background:#1a3a6e;border-radius:6px;overflow:hidden}
    .dim-fill{height:100%;border-radius:6px}
    .dim-val{font-size:12px;font-weight:700;width:36px;text-align:right;flex-shrink:0}

    /* Objetivos */
    .obj-card{background:#0d1b3e;border-radius:16px;padding:16px;margin-bottom:16px}
    .obj-item{background:#060d1a;border:1px solid #7c3aed44;border-radius:10px;padding:12px;margin-bottom:8px}
    .obj-titulo{font-size:12px;font-weight:700;color:#a78bfa;margin-bottom:6px}
    .obj-bar-wrap{display:flex;align-items:center;gap:8px}
    .obj-bar{flex:1;height:6px;background:#1a3a6e;border-radius:6px;overflow:hidden}
    .obj-bar-fill{height:100%;background:#7c3aed;border-radius:6px}
    .obj-pct{font-size:11px;color:#a78bfa;font-weight:700;width:36px;text-align:right}
    .obj-meta{font-size:10px;color:#4a6280;margin-top:4px}

    /* DISC */
    .disc-card{background:#0d1b3e;border-radius:16px;padding:16px;margin-bottom:16px;text-align:center}
    .disc-badge{display:inline-block;padding:8px 24px;border-radius:12px;font-size:28px;font-weight:900;margin-bottom:8px}
    .disc-name{font-size:14px;font-weight:700;margin-bottom:6px}
    .disc-desc{font-size:12px;color:#8fa3bf;line-height:1.5}

    /* Footer */
    .footer{text-align:center;padding:20px;font-size:11px;color:#2a4060}
    .footer strong{color:#00c2ff}

    /* Pedir ayuda */
    .ayuda-card{background:#0d1b3e;border-radius:16px;padding:16px;margin-bottom:16px}
    .ayuda-titulo{font-size:11px;font-weight:700;color:#4a6280;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px}
    .ayuda-sub{font-size:11px;color:#8fa3bf;margin-bottom:14px}
    .ayuda-btn{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:12px;border:1px solid #1a3a6e;background:#060d1a;color:#e8eff8;font-size:13px;font-weight:600;margin-bottom:8px;cursor:pointer;text-decoration:none}
    .ayuda-btn .ic{font-size:20px;flex-shrink:0}
    .ayuda-btn:active{background:#0d1b3e}
    .ayuda-ok{display:none;text-align:center;padding:12px;font-size:12px;color:#22c55e;background:#22c55e15;border-radius:10px;margin-top:4px}

    .loading{text-align:center;padding:60px 20px;color:#4a6280;font-size:14px}
    .error{text-align:center;padding:40px 20px;color:#ef4444;font-size:13px;background:#0d1b3e;border-radius:12px;margin:20px}
  </style>
</head>
<body>

<div class="header">
  <div class="header-logo">⚡</div>
  <div>
    <div class="header-title">SPORT COACHING 360</div>
    <div class="header-sub">Perfil de Rendimiento Mental</div>
  </div>
</div>

<div class="container" id="app">
  <div class="loading">Cargando tu perfil...</div>
</div>

<script>
const SB_URL = 'https://gltqhcnusblfovhxljcs.supabase.co';
const SK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdsdHFoY251c2JsZm92aHhsamNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NzM4NDQsImV4cCI6MjA5MTI0OTg0NH0.FrRzvRzz0k4b3jgHpGsxA10enM9AuSSXTPo7PAgVAXI';

async function q(path, opts) {
  try {
    const r = await fetch(SB_URL + '/rest/v1/' + path, {
      method: (opts && opts.m) || 'GET',
      headers: {
        'apikey': SK, 'Authorization': 'Bearer ' + SK, 'Content-Type': 'application/json',
        'Prefer': (opts && opts.h && opts.h.Prefer) || 'return=representation',
      },
      body: (opts && opts.b) ? JSON.stringify(opts.b) : undefined,
    });
    const t = await r.text();
    if (!r.ok) { console.error('Error en request:', t); return null; }
    return t ? JSON.parse(t) : null;
  } catch(e) { console.error('Error de red:', e); return null; }
}

const DISC_INFO = {
  D: { name: 'Dominante', color: '#ef4444', desc: 'Orientado a resultados, decisivo y directo. Rinde mejor con autonomía y desafíos concretos.' },
  I: { name: 'Influyente', color: '#f59e0b', desc: 'Entusiasta, sociable y optimista. Se activa con el reconocimiento y el ambiente positivo del equipo.' },
  S: { name: 'Estable', color: '#22c55e', desc: 'Consistente, leal y colaborativo. Rinde mejor con estructura clara y un entorno de confianza.' },
  C: { name: 'Concienzudo', color: '#00c2ff', desc: 'Analítico, preciso y metódico. Se destaca cuando tiene información completa y tiempo para procesar.' },
};

const DIMS_LABELS = {
  autoconocimiento: 'Autoconocimiento', motivacion: 'Motivación', confianza: 'Autoconfianza',
  regulacion: 'Regulación Emocional', atencion: 'Atención y Foco', metacognicion: 'Metacognición',
  potencial: 'Potencial', consistencia: 'Consistencia', liderazgo: 'Liderazgo',
  competitividad: 'Competitividad', decision: 'Toma de Decisiones', desempeno: 'Desempeño',
};

async function init() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const habId = params.get('hab');
  const entrenar = params.get('entrenar');
  const grupo = params.get('grupo');
  const app = document.getElementById('app');

  // Link grupal: UN solo link para todo el plantel — el jugador elige su
  // nombre y recién ahí arranca su cadena de ejercicios, registrada a él.
  if (grupo) {
    initGrupoEntrenamiento(grupo);
    return;
  }

  if (!token) {
    app.innerHTML = '<div class="error">Link inválido. Pedile al coordinador que te reenvíe tu perfil.</div>';
    return;
  }

  // Cargar resultado por token — primero por token_perfil (caso normal),
  // y si no aparece nada, probamos por id (caso del jugador que todavía
  // no tiene token_perfil generado, donde el link usa su id como respaldo)
  const selectCampos = 'id,jugador_nombre,jugador_pos,jugador_club,jugador_cat,disponibilidad,semaforo_color,semaforo_label,primary_disc,dims,sorted,modo_motivacional,grupo_codigo';
  let data = await q('resultados?token_perfil=eq.' + token + '&limit=1&select=' + selectCampos);
  if (!data || !data.length) {
    data = await q('resultados?id=eq.' + token + '&limit=1&select=' + selectCampos);
  }

  if (!data || !data.length) {
    app.innerHTML = '<div class="error">No encontramos tu perfil. Pedile al coordinador que lo comparta nuevamente.</div>';
    return;
  }

  const r = data[0];

  // Link nuevo (recomendado): trae TODOS los ejercicios pendientes de este
  // jugador y los encadena uno atrás del otro, sin que haga falta un link
  // distinto por cada ejercicio.
  if (entrenar) {
    const ORDEN_TIPOS = ['reaccion_simple','go_nogo','stroop','memoria_trabajo'];
    const pendientes = await q('entrenamiento_habilitado?jugador_id=eq.'+r.id+'&estado=eq.pendiente&order=creado_en.asc') || [];
    pendientes.sort(function(a,b){ return ORDEN_TIPOS.indexOf(a.tipo) - ORDEN_TIPOS.indexOf(b.tipo); });
    iniciarColaEntrenamiento(pendientes, r);
    return;
  }

  // Link viejo (compatibilidad): un solo ejercicio puntual por id de habilitación
  if (habId) {
    const hab = await q('entrenamiento_habilitado?id=eq.'+habId+'&limit=1');
    if (!hab || !hab.length) {
      app.innerHTML = '<div class="error">Este enlace no es válido o ya fue eliminado. Pedile al coordinador que te mande uno nuevo.</div>';
      return;
    }
    iniciarColaEntrenamiento(hab, r);
    return;
  }

  // Cargar objetivos activos
  const objetivos = await q('objetivos_jugador?jugador_nombre=eq.' + encodeURIComponent(r.jugador_nombre) + '&estado=eq.activo&limit=5') || [];

  renderPerfil(r, objetivos);
}

let PERFIL_ACTUAL = null;
let PERFIL_OBJETIVOS = [];

function renderPerfil(r, objetivos) {
  PERFIL_ACTUAL = r;
  PERFIL_OBJETIVOS = objetivos || [];
  const app = document.getElementById('app');
  const disp = r.disponibilidad || 0;
  const semCol = disp >= 80 ? '#22c55e' : disp >= 65 ? '#f59e0b' : '#ef4444';
  const semClass = disp >= 80 ? 'verde' : disp >= 65 ? 'amarillo' : 'rojo';
  const semLabel = disp >= 80 ? '🟢 DISPONIBLE' : disp >= 65 ? '🟡 PRECAUCIÓN' : '🔴 RIESGO';
  const disc = r.primary_disc || null;
  const discInfo = disc ? DISC_INFO[disc] : null;
  const initials = (r.jugador_nombre || '').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  const esProm = r.modo_motivacional === 'promocion';
  const modoColor = esProm ? '#22c55e' : '#7c3aed';

  // Dimensiones
  const dims = r.dims || {};
  const dimsArr = Object.entries(DIMS_LABELS).map(([k, label]) => ({
    key: k, label, val: dims[k] ? Math.round(dims[k] * 20) : null // convert 1-5 to %
  })).filter(d => d.val !== null).sort((a, b) => b.val - a.val);
  const top3 = dimsArr.slice(0, 3);
  const bot3 = dimsArr.slice(-3).reverse();

  let html = '';

  // Card jugador
  html += `<div class="player-card">
    <div class="player-avatar">${initials}</div>
    <div class="player-name">${r.jugador_nombre || '—'}</div>
    <div class="player-info">${[r.jugador_pos, r.jugador_club, r.jugador_cat ? 'Cat. ' + r.jugador_cat : ''].filter(Boolean).join(' · ')}</div>
  </div>`;

  // MDC
  html += `<div class="mdc-card ${semClass}">
    <div class="mdc-label">Disponibilidad Competitiva</div>
    <div class="mdc-valor" style="color:${semCol}">${disp}%</div>
    <div class="mdc-semaforo" style="color:${semCol}">${semLabel}</div>
    <div class="mdc-formula">D = T − I · Disponibilidad = Talento − Interferencia</div>
    <div class="mdc-barra">
      <div class="mdc-barra-fill" style="width:${disp}%;background:linear-gradient(90deg,${semCol}88,${semCol})"></div>
    </div>
  </div>`;

  // Modo Motivacional
  if (r.modo_motivacional) {
    const modoDesc = esProm
      ? 'Tu motor es el logro y el desafío. Te activás cuando el contexto te exige más y buscás superar tus límites.'
      : 'Tu motor es la seguridad y la certeza. Rendís mejor cuando tenés tu rol claro y pocas variables impredecibles.';
    const modoBaja = esProm
      ? 'Bajo presión podés acelerar demasiado o asumir riesgos innecesarios. El desafío puede volverse ansiedad.'
      : 'Bajo presión podés paralizarte ante la ambigüedad. Necesitás saber exactamente qué se espera de vos.';
    const modoFrase = esProm ? '"Este partido es tu momento. Decidí sin miedo."' : '"Hacé lo que entrenamos. Tu rol está claro."';

    html += `<div class="modo-card" style="border:1px solid ${modoColor}44">
      <div class="modo-header">
        <div class="modo-icon">${esProm ? '🚀' : '🛡'}</div>
        <div>
          <div class="modo-titulo" style="color:${modoColor}">Modo ${esProm ? 'Promoción' : 'Prevención'}</div>
          <div class="modo-sub">${esProm ? 'Motor de logro y crecimiento' : 'Motor de seguridad y estructura'}</div>
        </div>
      </div>
      <div class="modo-desc">${modoDesc}</div>
      <div class="modo-desc" style="color:#8fa3bf;font-size:11px;margin-bottom:10px">⚠ ${modoBaja}</div>
      <div class="modo-frase" style="background:${modoColor}22;color:${modoColor};border:1px solid ${modoColor}44">${modoFrase}</div>
    </div>`;
  }

  // Fortalezas
  if (top3.length) {
    html += `<div class="dims-card">
      <div class="dims-titulo">💪 Tus fortalezas</div>`;
    top3.forEach(d => {
      const col = d.val >= 80 ? '#22c55e' : d.val >= 60 ? '#f59e0b' : '#ef4444';
      html += `<div class="dim-row">
        <div class="dim-name">${d.label}</div>
        <div class="dim-barra"><div class="dim-fill" style="width:${d.val}%;background:${col}"></div></div>
        <div class="dim-val" style="color:${col}">${d.val}%</div>
      </div>`;
    });
    html += `</div>`;
  }

  // Áreas de trabajo
  if (bot3.length) {
    html += `<div class="dims-card">
      <div class="dims-titulo">🎯 Áreas de trabajo</div>`;
    bot3.forEach(d => {
      const col = d.val >= 80 ? '#22c55e' : d.val >= 60 ? '#f59e0b' : '#ef4444';
      html += `<div class="dim-row">
        <div class="dim-name">${d.label}</div>
        <div class="dim-barra"><div class="dim-fill" style="width:${d.val}%;background:${col}"></div></div>
        <div class="dim-val" style="color:${col}">${d.val}%</div>
      </div>`;
    });
    html += `</div>`;
  }

  // Objetivos de realización
  if (objetivos.length) {
    html += `<div class="obj-card">
      <div class="dims-titulo">🎯 Objetivos de realización activos</div>`;
    objetivos.forEach(obj => {
      const evals = obj.evaluaciones || [];
      const ultPct = evals.length ? evals[evals.length - 1].pct || 0 : 0;
      const progreso = evals.length ? Math.round(evals.length / obj.partidos_meta * 100) : 0;
      html += `<div class="obj-item">
        <div class="obj-titulo">${obj.objetivo}</div>
        <div class="obj-bar-wrap">
          <div class="obj-bar"><div class="obj-bar-fill" style="width:${ultPct}%"></div></div>
          <div class="obj-pct">${ultPct}%</div>
        </div>
        <div class="obj-meta">${evals.length} de ${obj.partidos_meta} partidos evaluados · Último: ${ultPct}% efectividad</div>
      </div>`;
    });
    html += `</div>`;
  }

  // DISC
  if (discInfo) {
    html += `<div class="disc-card">
      <div class="dims-titulo" style="text-align:center;margin-bottom:12px">Perfil DISC</div>
      <div class="disc-badge" style="background:${discInfo.color}22;color:${discInfo.color}">${disc}</div>
      <div class="disc-name" style="color:${discInfo.color}">${discInfo.name}</div>
      <div class="disc-desc">${discInfo.desc}</div>
    </div>`;
  }

  // Cuadrante Mental — radar de 5 capas + ejercicios cognitivos agrupados por capa
  html += renderCuadranteMental(r);

  // ============================================================
// CUADRANTE MENTAL — radar de 5 capas + ejercicios cognitivos
// agrupados por la capa que mejor entrenan. Mismas 5 capas que
// usa Informe Grupal en el panel — nada de categorías nuevas.
// ============================================================
const CAPAS_DEF = [
  { key:'autoconocimiento', nombre:'Autoconocimiento', color:'#8b5cf6', dims:['autoconocimiento','confianza'], ejercicios:['apuesta_confianza'] },
  { key:'talento', nombre:'Talento Diferencial', color:'#0ea5e9', dims:['potencial','liderazgo'], ejercicios:['memoria_trabajo'] },
  { key:'regulacion', nombre:'Regulación y Lectura', color:'#06b6d4', dims:['regulacion','metacognicion','decision'], ejercicios:['go_nogo','stroop'] },
  { key:'energia', nombre:'Energía y Aspiración', color:'#f59e0b', dims:['motivacion','consistencia'], ejercicios:['resistencia'] },
  { key:'destreza', nombre:'Destreza y Oportunidad', color:'#22c55e', dims:['atencion','competitividad','desempeno'], ejercicios:['reaccion_simple'] },
];
const EJ_ICONOS = { reaccion_simple:'⚡', go_nogo:'🚦', stroop:'🎨', memoria_trabajo:'🧩', apuesta_confianza:'🎯', resistencia:'🔥' };
const EJ_DESC = {
  reaccion_simple:'Ejecución rápida cuando el momento lo pide',
  go_nogo:'Control de impulsos bajo presión',
  stroop:'Foco sostenido en medio de interferencia',
  memoria_trabajo:'Capacidad cognitiva bajo carga',
  apuesta_confianza:'Animarse a arriesgar más después de fallar',
  resistencia:'Sostener el esfuerzo cuando se pone difícil',
};

function renderCuadranteMental(r){
  const dims = r.dims || {};
  const capas = CAPAS_DEF.map(function(c){
    const vals = c.dims.map(function(k){ return dims[k]; }).filter(function(v){ return v!=null; });
    const avg = vals.length ? vals.reduce(function(a,b){return a+b;},0)/vals.length : null;
    return Object.assign({}, c, { avg: avg });
  });
  const conDatos = capas.filter(function(c){ return c.avg!=null; });
  if(!conDatos.length) return ''; // sin diagnóstico completo, no se puede armar el radar

  const capaMasFloja = conDatos.slice().sort(function(a,b){ return a.avg-b.avg; })[0];

  // ── Radar SVG dinámico (5 puntos, ángulo fijo, radio según el puntaje real) ──
  const cx=130, cy=120, maxR=95;
  function punto(i, valor){
    const ang = (-90 + i*72) * Math.PI/180;
    const pct = valor!=null ? Math.max(0.08,(valor-1)/4) : 0.08;
    const rad = pct*maxR;
    return { x: cx+rad*Math.cos(ang), y: cy+rad*Math.sin(ang) };
  }
  function anillo(pct){
    return capas.map(function(c,i){
      const ang=(-90+i*72)*Math.PI/180;
      return (cx+pct*maxR*Math.cos(ang))+','+(cy+pct*maxR*Math.sin(ang));
    }).join(' ');
  }
  const puntos = capas.map(function(c,i){ return punto(i,c.avg); });
  const poligono = puntos.map(function(p){ return p.x+','+p.y; }).join(' ');
  const labelPos = capas.map(function(c,i){
    const ang=(-90+i*72)*Math.PI/180;
    const lr=maxR+22;
    return { x: cx+lr*Math.cos(ang), y: cy+lr*Math.sin(ang), anchor: Math.abs(Math.cos(ang))<0.3?'middle':(Math.cos(ang)>0?'start':'end') };
  });

  let svg = '<svg width="260" height="240" viewBox="0 0 260 240" style="display:block;margin:0 auto">';
  [0.33,0.66,1].forEach(function(p){ svg += '<polygon points="'+anillo(p)+'" fill="none" stroke="#1a3a6e" stroke-width="1"/>'; });
  capas.forEach(function(c,i){
    const ang=(-90+i*72)*Math.PI/180;
    svg += '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+maxR*Math.cos(ang))+'" y2="'+(cy+maxR*Math.sin(ang))+'" stroke="#1a3a6e" stroke-width="1"/>';
  });
  svg += '<polygon points="'+poligono+'" fill="#00c2ff33" stroke="#00c2ff" stroke-width="2"/>';
  puntos.forEach(function(p,i){ svg += '<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="'+capas[i].color+'"/>'; });
  capas.forEach(function(c,i){
    const lp=labelPos[i];

async function initGrupoEntrenamiento(grupoCod){
  const app = document.getElementById('app');
  document.querySelector('.header-sub').textContent = 'Entrenamiento cognitivo';

  const campos = 'id,jugador_nombre,jugador_pos,jugador_club,jugador_cat,disponibilidad,semaforo_color,semaforo_label,primary_disc,dims,sorted,modo_motivacional,grupo_codigo,fecha';
  const rows = await q('resultados?grupo_codigo=eq.'+encodeURIComponent(grupoCod)+'&order=fecha.desc&select='+campos);
  if(!rows || !rows.length){
    app.innerHTML = '<div class="error">No encontramos jugadores en este grupo. Verificá el link con tu técnico.</div>';
    return;
  }

  // Último resultado por jugador
  const vistos = {};
  const jugadores = [];
  rows.forEach(function(r){
    const k = (r.jugador_nombre||'').toLowerCase().trim();
    if(!k || vistos[k]) return;
    vistos[k] = 1;
    jugadores.push(r);
  });

  const ids = jugadores.map(function(j){ return j.id; });
  const habs = await q('entrenamiento_habilitado?estado=eq.pendiente&jugador_id=in.('+ids.join(',')+')&order=creado_en.asc') || [];
  const porJugador = {};
  habs.forEach(function(h){ (porJugador[h.jugador_id] = porJugador[h.jugador_id] || []).push(h); });

  GRUPO_ENT = { jugadores: jugadores, porJugador: porJugador };
  renderSelectorJugadorGrupo();
}

  if(!conPendientes.length){
    app.innerHTML = '<div class="player-card" style="margin-top:20px">'+
      '<div style="font-size:40px;margin-bottom:10px">✅</div>'+

    '<div style="font-size:36px;margin-bottom:8px">👋</div>'+

  '</div>';

  html += '<div style="display:flex;flex-direction:column;gap:8px">';
  conPendientes.forEach(function(j){
    const cant = GRUPO_ENT.porJugador[j.id].length;
    const initials = (j.jugador_nombre||'').split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2);
    html += '<div onclick="elegirJugadorGrupo(\''+j.id+'\')" style="display:flex;align-items:center;gap:12px;background:#0d1b3e;border:1px solid #1a3a6e;border-radius:12px;padding:12px 14px;cursor:pointer">'+

      '<span style="font-size:10.5px;font-weight:700;color:#00c2ff;background:#00c2ff18;border:1px solid #00c2ff40;border-radius:12px;padding:3px 10px;flex-shrink:0">'+cant+(cant===1?' ejercicio':' ejercicios')+'</span>'+
    '</div>';
  });

  app.innerHTML = '<div class="container" style="padding:0">'+html+'</div>';
}

function elegirJugadorGrupo(id){
  const j = GRUPO_ENT.jugadores.find(function(x){ return x.id === id; });
  if(!j) return;
  const app = document.getElementById('app');
  app.innerHTML = '<div class="player-card" style="margin-top:30px">'+
    '<div class="player-avatar">'+((j.jugador_nombre||'').split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2))+'</div>'+

  '</div>';
}

function confirmarJugadorGrupo(id){
  const j = GRUPO_ENT.jugadores.find(function(x){ return x.id === id; });
  if(!j) return;
  const ORDEN_TIPOS = ['reaccion_simple','go_nogo','stroop','memoria_trabajo'];
  const pendientes = (GRUPO_ENT.porJugador[id]||[]).slice();
  pendientes.sort(function(a,b){ return ORDEN_TIPOS.indexOf(a.tipo) - ORDEN_TIPOS.indexOf(b.tipo); });
  document.getElementById('app').innerHTML = '<div class="loading">Preparando tus ejercicios...</div>';
  iniciarColaEntrenamiento(pendientes, j);
}

function iniciarColaEntrenamiento(pendientes, r){

  document.querySelector('.header-sub').textContent = 'Entrenamiento cognitivo';

  ENT = {
    habId:null,

function mostrarSiguienteDeLaCola(){
  if (ENT.queueIndex >= ENT.queue.length) {
    cogMontarUI(
      '<div style="max-width:380px;padding:0 12px;text-align:center">'+
        '<div style="font-size:48px;margin-bottom:10px">🏁</div>'+
        '<div style="font-size:19px;font-weight:800;color:#fff;margin-bottom:8px">¡Completaste todo, '+ENT.jugadorNombre+'!</div>'+
        '<div style="font-size:13.5px;color:#8fa3bf">'+(ENT.libre?'Buen trabajo — tu resultado ya quedó guardado.':'Ya no tenés más ejercicios pendientes por ahora. Gracias por hacerlo con calma.')+'</div>'+
        (ENT.libre?'<button onclick="volverAlPerfil()" style="margin-top:22px;padding:12px 28px;background:#00c2ff;color:#06182b;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer">← Volver a mi perfil</button>':'')+
      '</div>'
    );
    return;
  }
  const h = ENT.queue[ENT.queueIndex];
  ENT.habId = h.id;
  if (h.estado === 'completado') {
    ENT.queueIndex++;
    mostrarSiguienteDeLaCola();
    return;
  }
  mostrarInstruccionesEntrenamiento(h.tipo);
}

function mostrarInstruccionesEntrenamiento(tipo){
  const info = COG_INSTRUCCIONES[tipo];
  const totalEnCola = ENT.queue.length;
  const progreso = totalEnCola > 1
    ? '<div style="font-size:11px;color:#8fa3bf;font-weight:700;margin-bottom:10px">EJERCICIO '+(ENT.queueIndex+1)+' DE '+totalEnCola+'</div>'
    : '';
  document.getElementById('ent-contenido').innerHTML =
    '<div style="max-width:380px;padding:0 12px;text-align:center">'+
      progreso+
      '<div style="font-size:44px;margin-bottom:10px">'+info.icono+'</div>'+
      '<div style="font-size:19px;font-weight:800;color:#fff;margin-bottom:6px">'+COG_LABELS[tipo]+'</div>'+
      '<div style="font-size:12px;color:#4a6280;margin-bottom:16px">Hola '+ENT.jugadorNombre+' — tenés un solo intento en cada uno, así que hacelo con calma.</div>'+
      '<div style="font-size:14.5px;color:#c0d0e8;line-height:1.6;white-space:pre-line;margin-bottom:26px;text-align:left;background:#0d1b3e;padding:16px;border-radius:12px">'+info.texto+'</div>'+
      '<button onclick="cogArrancarEjercicio(\''+tipo+'\')" style="padding:13px 36px;background:#00c2ff;color:#06182b;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;width:100%">▶ Empezar</button>'+

function cogMontarUI(html){
  document.getElementById('ent-contenido').innerHTML = html;
}

function cogArrancarEjercicio(tipo){
  COG = { tipo, estado:'inactivo', timeoutId:null, startTime:0 };
  if(tipo==='reaccion_simple') cogRSIniciar();
  else if(tipo==='go_nogo') cogGNGIniciar();
  else if(tipo==='stroop') cogStroopIniciar();
  else if(tipo==='memoria_trabajo') cogMemIniciar();
  else if(tipo==='apuesta_confianza') cogApuestaIniciar();
  else if(tipo==='resistencia') cogResistIniciar();
}

async function cogMostrarResultado(opts){
  let statsHtml='';
  if(opts.promedio_ms!=null){
    statsHtml='<div style="display:flex;gap:10px;justify-content:center;margin:16px 0">'+
      '<div style="background:#0d1b3e;border-radius:10px;padding:10px 16px;text-align:center"><div style="font-size:18px;font-weight:800;color:#00c2ff">'+opts.promedio_ms+' ms</div><div style="font-size:9.5px;color:#8fa3bf">PROMEDIO</div></div>'+
    '</div>';
  } else if(opts.detalle && opts.detalle.nivel_alcanzado!=null){
    statsHtml='<div style="display:flex;gap:10px;justify-content:center;margin:16px 0">'+
      '<div style="background:#0d1b3e;border-radius:10px;padding:10px 16px;text-align:center"><div style="font-size:18px;font-weight:800;color:#00c2ff">'+opts.detalle.nivel_alcanzado+'</div><div style="font-size:9.5px;color:#8fa3bf">NIVEL ALCANZADO</div></div>'+
    '</div>';
  }

  const quedanMas = (ENT.queueIndex + 1) < ENT.queue.length;

  cogMontarUI(
    '<div style="max-width:380px;padding:0 12px;text-align:center">'+
      '<div style="font-size:44px;margin-bottom:10px">🎉</div>'+
      '<div style="font-size:18px;font-weight:800;color:#fff;margin-bottom:4px">¡Listo, '+ENT.jugadorNombre+'!</div>'+
      '<div style="font-size:12.5px;color:#8fa3bf">Resultado guardado</div>'+
      statsHtml+
      '<div style="font-size:11.5px;color:#4a6280;margin-top:8px">'+(opts.detalleTexto||'')+'</div>'+
      (quedanMas?'<div style="font-size:12px;color:#00c2ff;margin-top:16px">Pasando al siguiente ejercicio...</div>':'')+
    '</div>'
  );

  const resultado = await q('ejercicios_cognitivos', {
    m:'POST',
    b:[{
      jugador_id: ENT.jugadorId,
      club_nombre: ENT.clubNombre,
      tipo: COG.tipo,
      tiempos_ms: opts.tiempos_ms || [],
      promedio_ms: opts.promedio_ms != null ? opts.promedio_ms : null,
      mejor_ms: opts.mejor_ms != null ? opts.mejor_ms : null,
      peor_ms: opts.peor_ms != null ? opts.peor_ms : null,
      detalle: opts.detalle || null,
      origen: 'jugador',
    }],
    h: { Prefer: 'return=representation' }
  });

  const resultadoId = (Array.isArray(resultado) && resultado.length) ? resultado[0].id : null;

  if(ENT.habId){
    await q('entrenamiento_habilitado?id=eq.'+ENT.habId, {
      m:'PATCH',
      b:{ estado:'completado', resultado_id: resultadoId, completado_en: new Date().toISOString() },
      h:{ Prefer:'return=minimal' }
    });
  }

  // Avanzar al siguiente ejercicio pendiente de la cola, si hay más
  ENT.queueIndex++;
  setTimeout(function(){ mostrarSiguienteDeLaCola(); }, 1600);
}

function cogRSIniciar(){ COG.ronda=0; COG.tiempos=[]; cogRSSiguienteRonda(); }
function cogRSSiguienteRonda(){
  if(COG.ronda >= 5){ cogRSFinalizar(); return; }
  COG.ronda++;
  cogMontarUI(
    '<div style="font-size:12px;color:#8fa3bf;font-weight:700;margin-bottom:10px">RONDA '+COG.ronda+' DE 5</div>'+
    '<div id="cog-rs-box" onclick="cogRSTap()" style="width:280px;height:280px;border-radius:20px;background:#0d1b3e;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;margin:0 auto">'+
      '<div id="cog-rs-msg" style="font-size:22px;font-weight:800;color:#e8eff8;text-align:center;padding:0 16px">Preparate...</div>'+
      '<div id="cog-rs-sub" style="font-size:12px;color:#8fa3bf;margin-top:8px;text-align:center;padding:0 16px">Tocá apenas se ponga verde</div>'+
    '</div>'
  );
  COG.estado='esperando';
  const delay = 1200 + Math.random()*2800;
  COG.timeoutId = setTimeout(function(){
    const box=document.getElementById('cog-rs-box');
    if(!box) return;
    box.style.background='#16a34a';
    document.getElementById('cog-rs-msg').textContent='¡TOCÁ AHORA!';
    document.getElementById('cog-rs-msg').style.color='#fff';
    document.getElementById('cog-rs-sub').textContent='';
    COG.startTime=performance.now();
    COG.estado='activo';
  }, delay);
}
function cogRSTap(){
  const box=document.getElementById('cog-rs-box');
  if(COG.estado==='esperando'){
    clearTimeout(COG.timeoutId);
    box.style.background='#7c1d1d';
    document.getElementById('cog-rs-msg').textContent='Muy pronto 🙈';
    document.getElementById('cog-rs-sub').textContent='Esa ronda no cuenta — se repite';
    COG.estado='penalizado';
    setTimeout(cogRSSiguienteRonda,1400);
  } else if(COG.estado==='activo'){
    const t=performance.now()-COG.startTime;
    COG.tiempos.push(t);
    box.style.background='#00c2ff';
    document.getElementById('cog-rs-msg').textContent=Math.round(t)+' ms';
    document.getElementById('cog-rs-msg').style.color='#06182b';
    document.getElementById('cog-rs-sub').textContent='';
    COG.estado='mostrando';
    setTimeout(cogRSSiguienteRonda,900);
  }
}
function cogRSFinalizar(){
  const tiempos=COG.tiempos;
  const promedio=tiempos.reduce(function(a,b){return a+b;},0)/tiempos.length;
  const mejor=Math.min.apply(null,tiempos), peor=Math.max.apply(null,tiempos);
  cogMostrarResultado({
    tiempos_ms:tiempos.map(function(t){return Math.round(t);}), promedio_ms:Math.round(promedio),
    mejor_ms:Math.round(mejor), peor_ms:Math.round(peor), detalle:null,
    detalleTexto:'Mejor: '+Math.round(mejor)+'ms · Peor: '+Math.round(peor)+'ms',
  });
}

// ---------- 2) Go / No-Go ----------
function cogGNGIniciar(){
  const seq=[];
  for(let i=0;i<12;i++) seq.push('go');
  for(let i=0;i<4;i++) seq.push('nogo');
  for(let i=seq.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=seq[i]; seq[i]=seq[j]; seq[j]=tmp; }
  COG.secuencia=seq; COG.indice=-1;
  COG.aciertosGo=0; COG.totalGo=0; COG.falsosPos=0; COG.totalNogo=0; COG.tiempos=[];
  cogGNGSiguiente();
}
function cogGNGSiguiente(){
  COG.indice++;
  if(COG.indice>=COG.secuencia.length){ cogGNGFinalizar(); return; }
  const tipoEst=COG.secuencia[COG.indice];
  if(tipoEst==='go') COG.totalGo++; else COG.totalNogo++;
  COG.tocado=false;
  cogMontarUI(
    '<div style="font-size:12px;color:#8fa3bf;font-weight:700;margin-bottom:14px">ESTÍMULO '+(COG.indice+1)+' DE '+COG.secuencia.length+'</div>'+
    '<div onclick="cogGNGTap()" style="display:flex;align-items:center;justify-content:center;cursor:pointer;padding:30px 0">'+
      '<div style="width:150px;height:150px;border-radius:50%;background:'+(tipoEst==='go'?'#16a34a':'#ef4444')+'"></div>'+
    '</div>'+
    '<div style="text-align:center;color:#8fa3bf;font-size:12px;padding:0 20px">Verde: tocá. Rojo: NO toques.</div>'
  );
  COG.estado='activo';
  COG.startTime=performance.now();
  COG.timeoutId=setTimeout(function(){ cogGNGSiguiente(); }, 900);
}
function cogGNGTap(){
  if(COG.estado!=='activo' || COG.tocado) return;
  COG.tocado=true;
  clearTimeout(COG.timeoutId);
  const tipoEst=COG.secuencia[COG.indice];
  if(tipoEst==='go'){ COG.tiempos.push(performance.now()-COG.startTime); COG.aciertosGo++; }
  else { COG.falsosPos++; }
  setTimeout(cogGNGSiguiente, 250);
}
function cogGNGFinalizar(){
  const tiempos=COG.tiempos;
  const promedio=tiempos.length?tiempos.reduce(function(a,b){return a+b;},0)/tiempos.length:0;
  const mejor=tiempos.length?Math.min.apply(null,tiempos):0;
  const peor=tiempos.length?Math.max.apply(null,tiempos):0;
  const precisionGo=COG.totalGo?Math.round(COG.aciertosGo/COG.totalGo*100):0;
  const inhibOk=COG.totalNogo-COG.falsosPos;
  const inhibicion=COG.totalNogo?Math.round(inhibOk/COG.totalNogo*100):0;
  cogMostrarResultado({
    tiempos_ms:tiempos.map(function(t){return Math.round(t);}), promedio_ms:Math.round(promedio),
    mejor_ms:Math.round(mejor), peor_ms:Math.round(peor),
    detalle:{aciertos_go:COG.aciertosGo,total_go:COG.totalGo,falsos_positivos:COG.falsosPos,total_nogo:COG.totalNogo,precision_go_pct:precisionGo,inhibicion_pct:inhibicion},
    detalleTexto:'Precisión: '+precisionGo+'% · Control de impulsos: '+inhibicion+'%',
  });
}

// ---------- 3) Stroop ----------
function cogStroopIniciar(){
  const colores=[{n:'ROJO',c:'#ef4444'},{n:'AZUL',c:'#3b82f6'},{n:'VERDE',c:'#22c55e'},{n:'AMARILLO',c:'#eab308'}];
  const trials=[];
  for(let i=0;i<12;i++){
    const palabra=colores[Math.floor(Math.random()*colores.length)];
    let tinta=colores[Math.floor(Math.random()*colores.length)];
    if(i%2===0) tinta=palabra;
    trials.push({palabra:palabra.n, tintaColor:tinta.c, tintaNombre:tinta.n, congruente:palabra.n===tinta.n});
  }
  COG.trials=trials; COG.indice=-1; COG.aciertos=0; COG.tiempos=[]; COG.tiemposCong=[]; COG.tiemposIncong=[]; COG.colores=colores;
  cogStroopSiguiente();
}
function cogStroopSiguiente(){
  COG.indice++;
  if(COG.indice>=COG.trials.length){ cogStroopFinalizar(); return; }
  const t=COG.trials[COG.indice];
  const botones=COG.colores.map(function(c){
    return '<button onclick="cogStroopResponder(\''+c.n+'\')" style="width:47%;height:52px;margin:5px 1%;border-radius:10px;border:none;background:'+c.c+';color:#fff;font-weight:800;font-size:12.5px;cursor:pointer">'+c.n+'</button>';
  }).join('');
  cogMontarUI(
    '<div style="font-size:12px;color:#8fa3bf;font-weight:700;margin-bottom:16px;text-align:center">ESTÍMULO '+(COG.indice+1)+' DE '+COG.trials.length+'</div>'+
    '<div style="text-align:center;font-size:42px;font-weight:900;color:'+t.tintaColor+';margin-bottom:10px">'+t.palabra+'</div>'+
    '<div style="font-size:12px;color:#8fa3bf;margin-bottom:14px;text-align:center;padding:0 16px">Elegí el COLOR en que está escrito</div>'+
    '<div style="display:flex;flex-wrap:wrap;max-width:320px;margin:0 auto">'+botones+'</div>'
  );
  COG.estado='activo';
  COG.startTime=performance.now();
}
function cogStroopResponder(colorElegido){
  if(COG.estado!=='activo') return;
  COG.estado='pausa';
  const t=COG.trials[COG.indice];
  const tiempo=performance.now()-COG.startTime;
  if(colorElegido===t.tintaNombre){
    COG.aciertos++;
    COG.tiempos.push(tiempo);
    if(t.congruente) COG.tiemposCong.push(tiempo); else COG.tiemposIncong.push(tiempo);
  }
  setTimeout(cogStroopSiguiente, 250);
}
function cogStroopFinalizar(){
  const promAll=function(t){ return t.length?Math.round(t.reduce(function(a,b){return a+b;},0)/t.length):0; };
  const promedio=promAll(COG.tiempos);
  const mejor=COG.tiempos.length?Math.round(Math.min.apply(null,COG.tiempos)):0;
  const peor=COG.tiempos.length?Math.round(Math.max.apply(null,COG.tiempos)):0;
  const precision=Math.round(COG.aciertos/COG.trials.length*100);
  cogMostrarResultado({
    tiempos_ms:COG.tiempos.map(function(t){return Math.round(t);}), promedio_ms:promedio, mejor_ms:mejor, peor_ms:peor,
    detalle:{aciertos:COG.aciertos,total:COG.trials.length,precision_pct:precision,tiempo_congruente_prom:promAll(COG.tiemposCong),tiempo_incongruente_prom:promAll(COG.tiemposIncong)},
    detalleTexto:'Precisión: '+precision+'%',
  });
}

// ---------- 4) Memoria de trabajo ----------
function cogMemIniciar(){ COG.nivel=3; COG.nivelAlcanzado=0; cogMemSiguienteNivel(); }
function cogMemSiguienteNivel(){
  if(COG.nivel>9){ cogMemFinalizar(); return; }
  COG.secuencia=[];
  for(let i=0;i<COG.nivel;i++) COG.secuencia.push(Math.floor(Math.random()*9)+1);
  COG.paso=0;
  cogMontarUI(
    '<div style="font-size:12px;color:#8fa3bf;font-weight:700;margin-bottom:14px;text-align:center">NIVEL '+COG.nivel+' — '+COG.nivel+' DÍGITOS</div>'+
    '<div id="cog-mem-num" style="font-size:64px;font-weight:900;color:#e8eff8;text-align:center">•</div>'+
    '<div style="font-size:12px;color:#8fa3bf;margin-top:14px;padding:0 20px;text-align:center">Memorizá los números — después los repetís AL REVÉS</div>'
  );
  setTimeout(function(){ cogMemMostrarSiguienteDigito(); }, 900);
}
function cogMemMostrarSiguienteDigito(){
  if(COG.paso>=COG.secuencia.length){ setTimeout(cogMemPedirRespuesta, 500); return; }
  const numEl=document.getElementById('cog-mem-num');
  if(numEl) numEl.textContent=COG.secuencia[COG.paso];
  COG.paso++;
  COG.timeoutId=setTimeout(function(){
    const el=document.getElementById('cog-mem-num');
    if(el) el.textContent='•';
    setTimeout(cogMemMostrarSiguienteDigito, 300);
  }, 800);
}
function cogMemPedirRespuesta(){ COG.respuesta=[]; cogMemRenderRespuesta(); }
function cogMemRenderRespuesta(){
  const botones=[1,2,3,4,5,6,7,8,9].map(function(n){
    return '<button onclick="cogMemDigito('+n+')" style="width:56px;height:56px;margin:4px;border-radius:10px;border:none;background:#1a3a6e;color:#fff;font-weight:800;font-size:18px;cursor:pointer">'+n+'</button>';
  }).join('');
  cogMontarUI(
    '<div style="font-size:12px;color:#8fa3bf;font-weight:700;margin-bottom:10px;text-align:center">NIVEL '+COG.nivel+' — REPETÍ AL REVÉS</div>'+
    '<div style="font-size:20px;font-weight:800;color:#00c2ff;min-height:30px;letter-spacing:5px;text-align:center">'+COG.respuesta.join(' ')+'</div>'+
    '<div style="display:flex;flex-wrap:wrap;justify-content:center;max-width:260px;margin:16px auto">'+botones+'</div>'+
    '<div style="display:flex;gap:10px;justify-content:center;margin-top:6px">'+
      '<button onclick="cogMemBorrar()" style="padding:8px 16px;background:#7c1d1d;color:#fff;border:none;border-radius:8px;cursor:pointer">Borrar</button>'+
      '<button onclick="cogMemConfirmar()" style="padding:8px 16px;background:#16a34a;color:#fff;border:none;border-radius:8px;cursor:pointer">Confirmar</button>'+
    '</div>'
  );
}
function cogMemDigito(n){ if(COG.respuesta.length>=COG.secuencia.length) return; COG.respuesta.push(n); cogMemRenderRespuesta(); }
function cogMemBorrar(){ COG.respuesta.pop(); cogMemRenderRespuesta(); }
function cogMemConfirmar(){
  const esperada=COG.secuencia.slice().reverse();
  const correcto = COG.respuesta.length===esperada.length && COG.respuesta.every(function(v,i){ return v===esperada[i]; });
  if(correcto){ COG.nivelAlcanzado=COG.nivel; COG.nivel++; cogMemSiguienteNivel(); }
  else { cogMemFinalizar(); }
}
function cogMemFinalizar(){
  cogMostrarResultado({
    tiempos_ms:[], promedio_ms:null, mejor_ms:null, peor_ms:null,
    detalle:{nivel_alcanzado:COG.nivelAlcanzado},
    detalleTexto:'Nivel alcanzado: '+COG.nivelAlcanzado+' dígitos en orden inverso.',
  });
}

// ---------- 5) Apuesta de Confianza ----------
// Mide confianza real: no cuánto acierta, sino si se anima a arriesgar más
// justo después de haber fallado. Mismo mecanismo que la apuesta de Racha.
function cogApuestaIniciar(){
  COG.ronda=0; COG.tiempos=[]; COG.aciertos=0; COG.fallos=0;
  COG.apuestasOfrecidas=0; COG.apuestasAceptadas=0; COG.aceptadasTrasFallo=0;
  COG.ultimaFueFallo=false; COG.apostando=false;
  cogApuestaSiguienteRonda();
}
function cogApuestaSiguienteRonda(){
  if(COG.ronda>=8){ cogApuestaFinalizar(); return; }
  COG.ronda++;
  const size = COG.apostando ? 90 : 150;
  const ventana = COG.apostando ? 550 : 950;
  cogMontarUI(
    '<div style="font-size:12px;color:#8fa3bf;font-weight:700;margin-bottom:10px">RONDA '+COG.ronda+' DE 8'+(COG.apostando?' · 🎯 APOSTADA (x2)':'')+'</div>'+
    '<div style="display:flex;align-items:center;justify-content:center;padding:20px 0">'+
      '<div id="cog-ap-box" onclick="cogApuestaTap()" style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+(COG.apostando?'#f59e0b':'#0091D5')+';cursor:pointer;transition:opacity '+ventana+'ms linear;display:flex;align-items:center;justify-content:center;font-size:28px">🎯</div>'+
    '</div>'+
    '<div style="text-align:center;color:#8fa3bf;font-size:12px">Tocá el círculo antes de que desaparezca</div>'
  );
  COG.estado='activo';
  COG.startTime=performance.now();
  const box=document.getElementById('cog-ap-box');
  requestAnimationFrame(function(){ if(box) box.style.opacity='0.15'; });
  COG.timeoutId=setTimeout(function(){
    if(COG.estado!=='activo') return;
    COG.estado='vencido';
    cogApuestaResolver(false);
  }, ventana);
}
function cogApuestaTap(){
  if(COG.estado!=='activo') return;
  clearTimeout(COG.timeoutId);
  COG.tiempos.push(performance.now()-COG.startTime);
  cogApuestaResolver(true);
}
function cogApuestaResolver(acierto){
  COG.estado='mostrando';
  if(acierto){ COG.aciertos++; COG.ultimaFueFallo=false; }
  else { COG.fallos++; COG.ultimaFueFallo=true; }
  COG.apostando=false;
  if(COG.ronda>=8){ setTimeout(cogApuestaFinalizar, 500); return; }
  setTimeout(cogApuestaOfrecer, 500);
}
function cogApuestaOfrecer(){
  COG.apuestasOfrecidas++;
  const trasFallo=COG.ultimaFueFallo;
  cogMontarUI(
    '<div style="max-width:320px;padding:0 12px;text-align:center">'+
      '<div style="font-size:30px;margin-bottom:8px">🎯</div>'+
      '<div style="font-size:16px;font-weight:800;color:#fff;margin-bottom:6px">¿Te la jugás?</div>'+
      '<div style="font-size:12.5px;color:#8fa3bf;margin-bottom:20px">El próximo puede ser más chico y rápido — vale el doble. Vos elegís.</div>'+
      '<div style="display:flex;gap:10px">'+
        '<button onclick="cogApuestaResponder(true,'+trasFallo+')" style="flex:1;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,#f59e0b,#d97706);color:#1a1200;font-weight:800;font-size:13.5px;cursor:pointer">Me la juego</button>'+
        '<button onclick="cogApuestaResponder(false,'+trasFallo+')" style="flex:1;padding:13px;border-radius:10px;border:1px solid #1a3a6e;background:#141f3a;color:#e8eff8;font-weight:700;font-size:13.5px;cursor:pointer">Normal</button>'+
      '</div>'+
    '</div>'
  );
}
function cogApuestaResponder(acepto, trasFallo){
  if(acepto){ COG.apuestasAceptadas++; if(trasFallo) COG.aceptadasTrasFallo++; }
  COG.apostando=acepto;
  cogApuestaSiguienteRonda();
}
function cogApuestaFinalizar(){
  const tiempos=COG.tiempos;
  const promedio=tiempos.length?tiempos.reduce(function(a,b){return a+b;},0)/tiempos.length:0;
  const indiceConfianza=COG.apuestasOfrecidas?Math.round(COG.apuestasAceptadas/COG.apuestasOfrecidas*100):0;
  cogMostrarResultado({
    tiempos_ms:tiempos.map(function(t){return Math.round(t);}),
    promedio_ms:tiempos.length?Math.round(promedio):null, mejor_ms:null, peor_ms:null,
    detalle:{
      aciertos:COG.aciertos, fallos:COG.fallos,
      apuestas_ofrecidas:COG.apuestasOfrecidas, apuestas_aceptadas:COG.apuestasAceptadas,
      aceptadas_tras_fallo:COG.aceptadasTrasFallo, indice_confianza:indiceConfianza,
    },
    detalleTexto:'Índice de confianza: '+indiceConfianza+'/100 · '+COG.aceptadasTrasFallo+' apuesta(s) justo después de fallar.',
  });
}

// ---------- 6) Resistencia ----------
// Mide persistencia y señal de riesgo de abandono — mismo mecanismo del
// "seguir o parar" de Racha, sin los reflejos extra, más corto y directo.
function cogResistIniciar(){
  COG.nivel=1; COG.racha=0; COG.fallosSeguidos=0;
  COG.decisiones=[]; COG.nivelDeParada=1; COG.parado=false;
  cogResistSpawn();
}
function cogResistSpawn(){
  if(COG.parado) return;
  const size=Math.max(70, 150-COG.nivel*8);
  const ventana=Math.max(500, 1100-COG.nivel*60);
  cogMontarUI(
    '<div style="display:flex;justify-content:space-between;max-width:280px;margin:0 auto 14px">'+
      '<div style="text-align:left"><div style="font-size:9px;color:#8fa3bf;font-weight:700">NIVEL</div><div style="font-size:22px;font-weight:800;color:#fff">'+COG.nivel+'</div></div>'+
      '<div style="text-align:right"><div style="font-size:9px;color:#8fa3bf;font-weight:700">RACHA</div><div style="font-size:22px;font-weight:800;color:#f59e0b">'+COG.racha+'</div></div>'+
    '</div>'+
    '<div style="display:flex;align-items:center;justify-content:center;padding:10px 0">'+
      '<div id="cog-res-box" onclick="cogResistTap()" style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#ffd9a8,#FF7A3D 55%,#c94e12 100%);cursor:pointer;transition:transform '+ventana+'ms linear,opacity '+ventana+'ms linear;display:flex;align-items:center;justify-content:center;font-size:26px">🔥</div>'+
    '</div>'
  );
  COG.estado='activo';
  COG.startTime=performance.now();
  const box=document.getElementById('cog-res-box');
  requestAnimationFrame(function(){ if(box){ box.style.transform='scale(0.15)'; box.style.opacity='0.15'; } });
  COG.timeoutId=setTimeout(function(){
    if(COG.estado!=='activo') return;
    cogResistMiss();
  }, ventana);
}
function cogResistTap(){
  if(COG.estado!=='activo') return;
  clearTimeout(COG.timeoutId);
  COG.estado='mostrando';
  COG.racha++; COG.fallosSeguidos=0;
  if(COG.racha%3===0) COG.nivel++;
  setTimeout(cogResistSpawn, 220);
}
function cogResistMiss(){
  COG.estado='mostrando';
  COG.racha=0; COG.fallosSeguidos++;
  if(COG.fallosSeguidos>=2){ cogResistElegir(); return; }
  setTimeout(cogResistSpawn, 300);
}
function cogResistElegir(){
  cogMontarUI(
    '<div style="max-width:320px;padding:0 12px;text-align:center">'+
      '<div style="font-size:38px;font-weight:800;color:#f59e0b;margin-bottom:2px">'+COG.nivel+'</div>'+
      '<div style="font-size:11px;color:#8fa3bf;margin-bottom:16px">nivel alcanzado</div>'+
      '<div style="font-size:16px;font-weight:800;color:#fff;margin-bottom:6px">¿Seguís o parás acá?</div>'+
      '<div style="font-size:12.5px;color:#8fa3bf;margin-bottom:20px">Se está poniendo difícil. Las dos opciones están perfectas.</div>'+
      '<div style="display:flex;flex-direction:column;gap:10px">'+
        '<button onclick="cogResistResponder(true)" style="padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,#33D69F,#1fae7d);color:#06182b;font-weight:800;font-size:13.5px;cursor:pointer">Seguir intentando</button>'+
        '<button onclick="cogResistResponder(false)" style="padding:13px;border-radius:10px;border:1px solid #1a3a6e;background:#141f3a;color:#e8eff8;font-weight:700;font-size:13.5px;cursor:pointer">Parar acá</button>'+
      '</div>'+
    '</div>'
  );
}
function cogResistResponder(sigue){
  COG.decisiones.push(sigue);
  if(sigue){ COG.fallosSeguidos=0; cogResistSpawn(); }
  else { COG.parado=true; COG.nivelDeParada=COG.nivel; cogResistFinalizar(); }
}
function cogResistFinalizar(){
  if(!COG.parado){ COG.nivelDeParada=COG.nivel; } // llegó al tope sin parar (raro, pero por las dudas)
  const vecesSeguir=COG.decisiones.filter(function(d){return d;}).length;
  const indicePersistencia=Math.min(100, Math.round((vecesSeguir*15)+(COG.nivelDeParada*6)));
  let riesgo='bajo';
  if(vecesSeguir===0 && COG.nivelDeParada<=2) riesgo='alto';
  else if(vecesSeguir<=1 && COG.nivelDeParada<=3) riesgo='medio';
  cogMostrarResultado({
    tiempos_ms:[], promedio_ms:null, mejor_ms:null, peor_ms:null,
    detalle:{
      nivel_alcanzado:COG.nivelDeParada, veces_eligio_seguir:vecesSeguir,
      indice_persistencia:indicePersistencia, senal_riesgo:riesgo,
    },
    detalleTexto:'Índice de persistencia: '+indicePersistencia+'/100 · Eligió seguir '+vecesSeguir+' vez(veces).',
  });
}

init();
</script>
