function cerrarAyuda(){ const m=document.getElementById('mo-ayuda'); if(m) m.remove(); }
const AYUDA_MOTIVOS=[
  {k:'hablar',t:'Quiero hablar con alguien'},
  {k:'personal',t:'Algo personal me está afectando'},
  {k:'grupo',t:'Un problema en el grupo o en el club'},
  {k:'urgente',t:'Es urgente',urg:true}];
let AYUDA_MOTIVO=null;
function elegirMotivoAyuda(k){
  AYUDA_MOTIVO=(AYUDA_MOTIVO===k?null:k);
  document.querySelectorAll('.ayuda-mot').forEach(el=>{
    const on=el.dataset.k===AYUDA_MOTIVO, urg=el.dataset.k==='urgente';
    el.style.background=on?(urg?'#dc2626':'#1d4ed8'):'#0d1b3e'; el.style.borderColor=on?(urg?'#f87171':'#60a5fa'):'#1a3a6e'; el.style.color=on?'#fff':'#cbd5e1';
  });
}
function abrirAyuda(){
  cerrarAyuda(); AYUDA_MOTIVO=null;
  const tel=(n,t,sub)=>'<a href="tel:'+n.replace(/[^0-9+]/g,'')+'" style="display:flex;justify-content:space-between;align-items:center;gap:8px;text-decoration:none;background:#0d1b3e;border:1px solid #1a3a6e;border-radius:10px;padding:8px 12px;margin-top:6px"><span style="font-size:15px;font-weight:800;color:#fff">📞 '+t+'</span><span style="font-size:11px;color:#94a3b8;text-align:right">'+sub+'</span></a>';
  const m=document.createElement('div'); m.id='mo-ayuda';
  m.style.cssText='position:fixed;inset:0;z-index:1000;background:#000c;display:flex;align-items:flex-end;justify-content:center';
  m.innerHTML='<div style="background:#0a1024;border:1px solid #1a3a6e;border-radius:18px 18px 0 0;width:min(520px,100%);max-height:92vh;overflow-y:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));color:#e8eff8;font-family:inherit">'+
    '<div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:19px;font-weight:900">🔔 Avisar a mi club</div><button onclick="cerrarAyuda()" style="background:none;border:none;color:#94a3b8;font-size:22px;cursor:pointer">✕</button></div>'+
    '<div style="font-size:14px;color:#cbd5e1;line-height:1.55;margin-top:6px">Le mandamos un aviso a tu cuerpo técnico para que alguien se comunique con vos. No hace falta que expliques nada. Pedir ayuda es una decisión fuerte.</div>'+
    '<div style="margin-top:12px;font-size:11px;font-weight:800;color:#94a3b8;letter-spacing:0.06em">¿QUERÉS CONTARNOS EL MOTIVO? (OPCIONAL)</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px">'+AYUDA_MOTIVOS.map(x=>'<button type="button" class="ayuda-mot" data-k="'+x.k+'" onclick="elegirMotivoAyuda(\''+x.k+'\')" style="padding:10px 8px;border-radius:10px;border:1px solid #1a3a6e;background:#0d1b3e;color:#cbd5e1;font-size:13px;font-weight:700;cursor:pointer;text-align:center">'+(x.urg?'⚠ ':'')+x.t+'</button>').join('')+'</div>'+
    '<button id="btn-avisar-club" onclick="avisarClubAyuda()" style="width:100%;margin-top:12px;padding:14px;border-radius:12px;border:none;background:#16a34a;color:#fff;font-size:16px;font-weight:900;cursor:pointer">Enviar aviso a mi club</button>'+
    '<div id="ayuda-estado" style="font-size:13px;line-height:1.5;margin-top:10px"></div>'+
    '<details style="margin-top:14px;border-top:1px solid #1a3a6e;padding-top:10px"><summary style="cursor:pointer;font-size:13px;font-weight:800;color:#fca5a5">🆘 Si es una emergencia o estás en peligro ahora</summary>'+
      '<a href="tel:911" style="display:block;text-align:center;text-decoration:none;background:#dc2626;color:#fff;border-radius:12px;padding:12px;margin-top:10px;font-size:17px;font-weight:900">📞 Llamar al 911</a>'+
      '<div style="font-size:11px;color:#94a3b8;margin-top:10px">Líneas gratuitas para hablar con alguien</div>'+
      '<div style="font-size:11.5px;color:#cbd5e1;margin-top:6px">🇦🇷 Argentina · Centro de Asistencia al Suicida</div>'+
      tel('135','135','Capital y Gran Bs. As.')+tel('08003451435','0800 345 1435','Todo el país')+
      '<div style="font-size:11.5px;color:#cbd5e1;margin-top:8px">🇨🇷 Costa Rica</div>'+
      tel('1322','1322','Atención psicológica 24 h')+tel('22723774','2272-3774','Línea Aquí Estoy')+
    '</details></div>';
  m.addEventListener('click',e=>{ if(e.target===m) cerrarAyuda(); });
  document.body.appendChild(m);
  try{ const t=parseInt(localStorage.getItem('sc360_ayuda_ts')||'0',10); if(t&&Date.now()-t<30*60000) ayudaConfirmada(t); }catch(e){}
}
function ayudaConfirmada(ts){
  const est=document.getElementById('ayuda-estado'), b=document.getElementById('btn-avisar-club');
  if(b){ b.disabled=true; b.style.opacity='0.6'; b.textContent='✓ Aviso enviado a tu club'; }
  document.querySelectorAll('.ayuda-mot').forEach(el=>{ el.disabled=true; });
  const min=Math.max(0,Math.round((Date.now()-ts)/60000));
  if(est) est.innerHTML='<div style="background:#052e16;border:1px solid #16a34a;border-radius:10px;padding:10px 12px;color:#bbf7d0">Listo. Le avisamos a tu club'+(min?' hace '+min+' min':'')+' para que alguien se comunique con vos.<br><b>Si no te contactan pronto o sentís que estás en riesgo, no esperes: abrí "Si es una emergencia" acá abajo.</b></div>';
}
async function avisarClubAyuda(){
  const r=window.JUG_R||{}; const b=document.getElementById('btn-avisar-club'), est=document.getElementById('ayuda-estado');
  if(b){ b.disabled=true; b.textContent='Enviando…'; }
  let grupoNombre=null;
  try{ if(r.grupo_codigo){ const g=await q('grupos?codigo=eq.'+encodeURIComponent(r.grupo_codigo)+'&select=nombre&limit=1'); grupoNombre=g&&g[0]?g[0].nombre:null; } }catch(e){}
  const mot=AYUDA_MOTIVOS.find(x=>x.k===AYUDA_MOTIVO);
  const urgente=AYUDA_MOTIVO==='urgente';
  const detalle=(urgente?'⚠ URGENTE · ':'')+(mot&&!urgente?'Motivo: '+mot.t+' · ':'')+'Pidió que alguien del club se comunique con él/ella.';
  // Se crea con una función acotada de la base (la tabla de alertas no es pública).
  // La función devuelve el id: si hay id, el aviso quedó registrado de verdad.
  let creado=false;
  try{
    const r2=await fetch(SB_URL+'/rest/v1/rpc/crear_pedido_ayuda',{method:'POST',headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json'},
      body:JSON.stringify({p_jugador:r.jugador_nombre||'Jugador',p_grupo_codigo:r.grupo_codigo||null,p_grupo_nombre:grupoNombre,p_detalle:detalle,p_urgente:urgente})});
    if(r2.ok){ const id=await r2.json(); creado=!!id; }
    else if(r2.status===404){
      // Respaldo: la función todavía no existe en la base → como antes
      const ok=await q('alertas',{m:'POST',b:{tipo:'pedido_ayuda',nivel:urgente?'alta':'media',estado:'activa',jugador_nombre:r.jugador_nombre||'Jugador',grupo_codigo:r.grupo_codigo||null,grupo_nombre:grupoNombre,detalle}});
      creado=Array.isArray(ok)&&ok.length>0;
    }
  }catch(e){ creado=false; }
  if(!creado){
    if(est) est.innerHTML='<div style="background:#3b0d12;border:1px solid #ef4444;border-radius:10px;padding:10px 12px;color:#fecaca">No pudimos enviar el aviso. Escribile directamente a alguien de tu club o, si es una emergencia, abrí la sección de abajo.</div>';
    if(b){ b.disabled=false; b.textContent='Reintentar'; }
    return;
  }
  // Aviso por mail además del panel (para que llegue aunque nadie tenga el panel abierto)
  try{ fetch(AYUDA_FORM,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({_subject:(urgente?'🆘 URGENTE · ':'🔔 ')+'Pedido de ayuda — '+(r.jugador_nombre||'Jugador'),Jugador:r.jugador_nombre||'—',Club:r.jugador_club||'—',Grupo:grupoNombre||r.grupo_codigo||'—',Motivo:mot?mot.t:'No indicó',Fecha:new Date().toLocaleString('es-AR'),Mensaje:'El jugador pidió que alguien del club lo contacte'+(urgente?' y lo marcó como URGENTE':'')+'. Comunicarse lo antes posible.'})}).catch(()=>{}); }catch(e){}
  const ts=Date.now(); try{ localStorage.setItem('sc360_ayuda_ts',String(ts)); }catch(e){}
  ayudaConfirmada(ts);
}

  if(/arquer|portero/.test(n)) return 'ARQ'; if(/lateral/.test(n)) return 'LAT'; if(/central|defens|zaguer|libero/.test(n)) return 'DEF';
  if(/volante|medio|pivote|interior|conten/.test(n)) return 'MED'; if(/enganche/.test(n)) return 'ENG'; if(/extremo|wing/.test(n)) return 'EXT';
  if(/delanter|punta|9/.test(n)) return 'DEL'; return (p||'').slice(0,3).toUpperCase()||'—';
}
async function cartaCanvas(r){
    const W=1080,H=1350, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const g=cv.getContext('2d');
    const F='"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif';
    const colD=v=>v>=80?'#22c55e':v>=65?'#facc15':'#f87171';
    // Fondo y marco
    const bg=g.createLinearGradient(0,0,W,H); bg.addColorStop(0,'#0b1b3d'); bg.addColorStop(0.55,'#071028'); bg.addColorStop(1,'#04070f');
    g.fillStyle=bg; g.fillRect(0,0,W,H);
    const glow=g.createRadialGradient(W/2,430,40,W/2,430,520); glow.addColorStop(0,'rgba(0,194,255,0.26)'); glow.addColorStop(1,'rgba(0,194,255,0)');
    g.fillStyle=glow; g.fillRect(0,0,W,H);
    g.strokeStyle='rgba(0,194,255,0.45)'; g.lineWidth=4; g.beginPath(); g.roundRect(30,30,W-60,H-60,40); g.stroke();
    // Marca
    g.textBaseline='middle';
    const logo=await cartaImg(CARTA_LOGO,false);
    if(logo) g.drawImage(logo,72,70,74,74);
    g.fillStyle='#ffffff'; g.font='900 38px '+F; g.fillText('SPORT COACHING 360',162,94);
    g.fillStyle='#7fd8ff'; g.font='600 21px '+F; g.fillText('Perfil de rendimiento mental',164,128);
    // Número general + posición (estilo carta)
    const D=r.disponibilidad||0;
    g.textAlign='center';
    g.fillStyle=colD(D); g.font='900 120px '+F; g.fillText(String(D),W-150,128);
    g.fillStyle='#ffffff'; g.font='800 32px '+F; g.fillText(cartaPosAbrev(r.jugador_pos),W-150,204);
    g.fillStyle='#7c8fae'; g.font='700 15px '+F; g.fillText('DISPONIBILIDAD',W-150,236);
    // Foto
    const cx=W/2, cy=440, R=228;
    let foto=await cartaImg(r.foto_url,true);
    if(foto){ try{ const t=document.createElement('canvas'); t.width=t.height=8; const tg=t.getContext('2d'); tg.drawImage(foto,0,0,8,8); tg.getImageData(0,0,1,1); }catch(e){ foto=null; } }
    g.save(); g.beginPath(); g.arc(cx,cy,R,0,Math.PI*2); g.closePath(); g.fillStyle='#0d1b3e'; g.fill(); g.clip();
    if(foto){ const sc=Math.max((2*R)/foto.width,(2*R)/foto.height), w=foto.width*sc, h=foto.height*sc; g.drawImage(foto,cx-w/2,cy-h/2,w,h); }
    else { g.fillStyle='#94a3b8'; g.font='800 160px '+F; g.fillText((r.jugador_nombre||'?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase(),cx,cy+6); }
    g.restore();
    g.lineWidth=11; g.strokeStyle='#facc15'; g.beginPath(); g.arc(cx,cy,R+6,0,Math.PI*2); g.stroke();
    g.lineWidth=3; g.strokeStyle='rgba(0,194,255,0.8)'; g.beginPath(); g.arc(cx,cy,R+20,0,Math.PI*2); g.stroke();
    const esc=await cartaImg((document.getElementById('club-escudo')&&document.getElementById('club-escudo').style.display!=='none'?document.getElementById('club-escudo').src:''),true);
    // El escudo solo se dibuja si el sitio donde está guardado lo permite (si no, "ensucia" la imagen y no se puede exportar)
    let escOk=false; if(esc){ try{ const t=document.createElement('canvas'); t.width=t.height=8; const tg=t.getContext('2d'); tg.drawImage(esc,0,0,8,8); tg.getImageData(0,0,1,1); escOk=true; }catch(e){ escOk=false; } }
    if(escOk){ g.save(); g.beginPath(); g.arc(cx+R-14,cy+R-24,54,0,Math.PI*2); g.fillStyle='#ffffff'; g.fill(); g.restore(); g.drawImage(esc,cx+R-58,cy+R-68,88,88); }
    // Nombre y datos
    g.fillStyle='#ffffff'; let fz=64; g.font='900 '+fz+'px '+F;
    const nom=(r.jugador_nombre||'').toUpperCase(); while(g.measureText(nom).width>W-140&&fz>36){ fz-=2; g.font='900 '+fz+'px '+F; }
    g.fillText(nom,cx,736);
    g.fillStyle='#b9c8dc'; g.font='600 28px '+F;
    g.fillText([r.jugador_club,r.jugador_pos,r.jugador_cat?'Cat. '+r.jugador_cat:''].filter(Boolean).join('  ·  '),cx,786);
    // Rol + perfil
    const disc=(r.primary_disc||'').charAt(0);
    const rDef=(typeof ROLES_PUESTO!=='undefined')?ROLES_PUESTO[r.jugador_pos||'']:null;
    const rol=rDef?rDef.rol:({S:'CALMA',D:'INTENSIDAD',C:'EQUILIBRIO',I:'DECISIÓN'})[disc]||null;
    const ri=rol&&typeof ROL_INFO_PJ!=='undefined'?ROL_INFO_PJ[rol]:null;
    const dn=CARTA_DISC[disc];
    const piezas=[]; if(rol) piezas.push(['ROL: '+rol,ri?ri.color:'#00c2ff']); if(dn) piezas.push(['PERFIL '+dn[0].toUpperCase(),'#00c2ff']);
    const pw=400,gap=22,tot=piezas.length*pw+(piezas.length-1)*gap; let px=cx-tot/2;
    piezas.forEach(p=>{ g.fillStyle='rgba(13,27,62,0.9)'; g.beginPath(); g.roundRect(px,824,pw,62,31); g.fill(); g.strokeStyle=p[1]; g.lineWidth=3; g.stroke();
      g.fillStyle='#ffffff'; g.font='800 27px '+F; g.fillText(p[0],px+pw/2,856); px+=pw+gap; });
    // Radar de las 5 capas (izquierda)
    const dd=r.dims||{};
    const capas=(typeof CAPAS_DEF_PJ!=='undefined'?CAPAS_DEF_PJ:[]).map(c=>{ const v=c.dims.map(k=>dd[k]).filter(x=>x!=null&&x>0); return {l:({autoconocimiento:'AUTOCONOC.',talento:'TALENTO',regulacion:'REGULACIÓN',energia:'ENERGÍA',destreza:'DESTREZA'})[c.key]||c.nombre.toUpperCase(),v:v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length/5*100):0}; });
    const rx=318, ry=1112, RR=126;
    if(capas.length===5){
      const pt=(i,f)=>{ const a=-Math.PI/2+i*2*Math.PI/5; return [rx+Math.cos(a)*RR*f, ry+Math.sin(a)*RR*f]; };
      [0.25,0.5,0.75,1].forEach(f=>{ g.beginPath(); for(let i=0;i<5;i++){ const [x,y]=pt(i,f); i?g.lineTo(x,y):g.moveTo(x,y); } g.closePath(); g.strokeStyle='rgba(148,163,184,0.25)'; g.lineWidth=2; g.stroke(); });
      for(let i=0;i<5;i++){ const [x,y]=pt(i,1); g.beginPath(); g.moveTo(rx,ry); g.lineTo(x,y); g.strokeStyle='rgba(148,163,184,0.2)'; g.stroke(); }
      g.beginPath(); capas.forEach((c,i)=>{ const [x,y]=pt(i,Math.max(0.05,c.v/100)); i?g.lineTo(x,y):g.moveTo(x,y); }); g.closePath();
      g.fillStyle='rgba(0,194,255,0.30)'; g.fill(); g.strokeStyle='#00c2ff'; g.lineWidth=4; g.stroke();
      capas.forEach((c,i)=>{ const [x,y]=pt(i,Math.max(0.05,c.v/100)); g.beginPath(); g.arc(x,y,7,0,Math.PI*2); g.fillStyle='#00c2ff'; g.fill(); });
      capas.forEach((c,i)=>{ const [x,y]=pt(i,1.32); g.fillStyle='#cfe0f5'; g.font='800 21px '+F; g.fillText(c.l,x,y-12); g.fillStyle=colD(c.v); g.font='900 26px '+F; g.fillText(String(c.v),x,y+14); });
    }
    // Fortalezas + frase (derecha)
    const top=Object.keys(DIM_LABELS).filter(k=>dd[k]>0).map(k=>({l:DIM_LABELS[k],v:Math.round(dd[k]/5*100)})).sort((a,b)=>b.v-a.v).slice(0,3);
    const fx=640, fw=370;
    g.textAlign='left'; g.fillStyle='#22c55e'; g.font='800 22px '+F; g.fillText('FORTALEZAS',fx,958);
    top.forEach((t,i)=>{ const y=984+i*82;
      g.fillStyle='rgba(34,197,94,0.14)'; g.beginPath(); g.roundRect(fx,y,fw,66,16); g.fill(); g.strokeStyle='rgba(34,197,94,0.55)'; g.lineWidth=2; g.stroke();
      g.fillStyle='#ffffff'; let z=26; g.font='700 '+z+'px '+F; while(g.measureText(t.l).width>fw-110&&z>17){ z--; g.font='700 '+z+'px '+F; } g.fillText(t.l,fx+18,y+34);
      g.textAlign='right'; g.fillStyle='#4ade80'; g.font='900 28px '+F; g.fillText(String(t.v),fx+fw-18,y+34); g.textAlign='left'; });
    if(dn){ g.fillStyle='#9fb3cc'; g.font='italic 600 23px '+F; g.fillText('“'+dn[1]+'”',fx,1250); }
    // Pie
    g.textAlign='center'; g.fillStyle='#5d7391'; g.font='600 21px '+F; g.fillText('app.sportcoachingpro.com  ·  App de medición de rendimiento mental',cx,1302);
    return cv;
}

let MI_CARTA_BLOB=null;
function htmlMiCarta(){
  return '<div id="mi-carta" style="max-width:420px;margin:0 auto 22px;text-align:center">'+
    '<img id="mi-carta-img" alt="Mi carta" style="width:100%;border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,0.5);display:none"/>'+
    '<div id="mi-carta-cargando" style="padding:30px;color:#8fa3bf;font-size:13px">Armando tu carta…</div>'+
    '<div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap">'+
      '<button onclick="compartirMiCarta()" style="flex:1;min-width:150px;padding:13px;border:none;border-radius:10px;background:#00c2ff;color:#06182b;font-size:14px;font-weight:800;cursor:pointer">📲 Compartir mi carta</button>'+
      '<button onclick="descargarMiCarta()" style="flex:1;min-width:150px;padding:13px;border-radius:10px;background:transparent;color:#00c2ff;border:1px solid #00c2ff66;font-size:14px;font-weight:800;cursor:pointer">⬇ Descargar</button>'+
    '</div>'+
    '<div style="font-size:11px;color:#4a6280;margin-top:8px">Lista para subir a Instagram o mandar por WhatsApp</div></div>';
}
async function renderMiCarta(r){
  try{
    const cv=await cartaCanvas(r);
    const img=document.getElementById('mi-carta-img'), c=document.getElementById('mi-carta-cargando');
    MI_CARTA_BLOB=await new Promise(res=>cv.toBlob(res,'image/png'));
    if(img){ img.src=URL.createObjectURL(MI_CARTA_BLOB); img.style.display='block'; }
    if(c) c.remove();
  }catch(e){ const box=document.getElementById('mi-carta'); if(box) box.remove(); }
}
function miCartaArchivo(){ const n='SC360_'+((PERFIL_ACTUAL&&PERFIL_ACTUAL.jugador_nombre)||'jugador').replace(/[^A-Za-z0-9]+/g,'_')+'.png'; return new File([MI_CARTA_BLOB],n,{type:'image/png'}); }
function descargarMiCarta(){
  if(!MI_CARTA_BLOB) return; const f=miCartaArchivo();
  const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
async function compartirMiCarta(){
  if(!MI_CARTA_BLOB) return; const f=miCartaArchivo();
  if(navigator.canShare&&navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f],title:'Sport Coaching 360',text:'Mi perfil de rendimiento mental en Sport Coaching 360'}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
  descargarMiCarta();
}
