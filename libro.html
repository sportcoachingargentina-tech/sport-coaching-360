<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Sport Coaching 360 — Probá el MDC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0b0e14; --surface:#141822; --gold:#d4a830; --blue:#1E6FD9;
    --ink:#f5f1e8; --muted:#8a8f9c; --green:#22c55e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(ellipse 120% 60% at 50% -10%, #1a2030 0%, var(--bg) 55%);color:var(--ink);font-family:'Oswald',Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}
  .page{width:100%;max-width:460px;padding:30px 22px 50px;display:flex;flex-direction:column;min-height:100vh}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:30px}
  .brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#1E6FD9,#0d47a1);display:flex;align-items:center;justify-content:center;font-size:16px}
  .brand-text{font-size:13px;font-weight:700;letter-spacing:0.06em}
  .brand-dot{width:6px;height:6px;border-radius:50%;background:#3dd1ff;display:inline-block;margin:0 6px}

  .libro-tag{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid #262c3a;padding:8px 14px;border-radius:20px;font-size:12px;color:var(--muted);margin-bottom:20px}

  h1{font-family:'Fraunces',serif;font-size:27px;font-weight:500;line-height:1.3;margin-bottom:14px}
  h1 em{color:var(--gold);font-style:italic}
  .sub{font-size:14.5px;color:var(--muted);line-height:1.55;margin-bottom:28px}

  .cta{display:block;width:100%;text-align:center;padding:17px;border-radius:14px;background:var(--gold);color:#1a1305;font-family:'Oswald',sans-serif;font-weight:600;font-size:15.5px;border:none;cursor:pointer;box-shadow:0 10px 26px -8px #d4a83055}
  .cta:disabled{opacity:0.35;cursor:not-allowed;box-shadow:none}
  .cta-ghost{display:block;width:100%;text-align:center;padding:14px;border-radius:12px;background:transparent;color:var(--muted);font-family:'Oswald',sans-serif;font-weight:500;font-size:13px;border:1px solid #262c3a;cursor:pointer;margin-top:10px}

  .progreso{display:flex;gap:6px;margin-bottom:26px}
  .progreso div{flex:1;height:4px;border-radius:4px;background:#262c3a}
  .progreso div.on{background:var(--gold)}

  .pregunta{font-size:19px;font-weight:500;line-height:1.4;margin-bottom:24px;min-height:80px}
  .escala{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
  .op{padding:15px 18px;border-radius:12px;background:var(--surface);border:1px solid #262c3a;font-size:14px;cursor:pointer;transition:all 0.15s}
  .op:active{transform:scale(0.98)}
  .op.sel{border-color:var(--gold);background:#d4a83015;color:var(--gold);font-weight:600}

  .resultado-ring{position:relative;width:170px;height:170px;margin:10px auto 20px}
  .resultado-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .resultado-ring .track{fill:none;stroke:#1f2430;stroke-width:9}
  .resultado-ring .fill{fill:none;stroke:var(--gold);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.2s ease}
  .resultado-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .resultado-num .n{font-size:44px;font-weight:700}
  .resultado-num .l{font-size:10.5px;color:var(--muted);letter-spacing:0.05em;margin-top:2px}

  .adelanto{background:var(--surface);border-left:3px solid var(--blue);padding:14px 16px;border-radius:0 10px 10px 0;font-size:13px;color:#c8c3b6;line-height:1.6;margin-bottom:26px}

  label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;margin-top:16px}
  input[type=text]{width:100%;padding:13px 14px;border-radius:10px;background:var(--surface);border:1px solid #262c3a;color:var(--ink);font-family:'Oswald',sans-serif;font-size:14px}
  input[type=text]:focus{outline:none;border-color:var(--gold)}

  .ok{text-align:center;padding:60px 10px}
  .ok .ic{font-size:52px;margin-bottom:18px}
  .footer-nota{font-size:10.5px;color:#4b5160;text-align:center;margin-top:24px;line-height:1.5}
</style>
</head>
<body>
<div class="page" id="app"></div>

<script>
const SB_URL='https://gltqhcnusblfovhxljcs.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdsdHFoY251c2JsZm92aHhsamNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NzM4NDQsImV4cCI6MjA5MTI0OTg0NH0.FrRzvRzz0k4b3jgHpGsxA10enM9AuSSXTPo7PAgVAXI';

// ⚠️ Reemplazar por el número real de WhatsApp de Eduardo (con código de país, sin +)
const WA_EDUARDO='5492612502454';

async function q(path,opts){
  try{
    const r=await fetch(SB_URL+'/rest/v1/'+path,{
      method:(opts&&opts.m)||'GET',
      headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json',
        'Prefer':(opts&&opts.h&&opts.h.Prefer)||'return=representation'},
      body:(opts&&opts.b)?JSON.stringify(opts.b):undefined,
    });
    const t=await r.text();
    if(!r.ok){ console.error('Error request:',t); return null; }
    return t?JSON.parse(t):null;
  }catch(e){ console.error('Error de red:',e); return {__error:true, mensaje:String(e)}; }
}

// Preguntas de MUESTRA — no son las 42 reales del MDC. Inspiradas en los
// mismos ejes (confianza, foco, manejo del error, presión, motivación)
// pero escritas de cero, para dar una idea real de qué mide sin exponer
// el instrumento completo.
const PREGUNTAS=[
  {t:'Cuando algo me sale mal en un partido, logro dejarlo atrás rápido y seguir jugando bien.', dim:'Recuperación'},
  {t:'En los momentos de mayor presión, mantengo la cabeza clara para decidir.', dim:'Decisión bajo presión'},
  {t:'Me cuesta mantener la concentración durante todo el partido/entrenamiento.', dim:'Foco', inv:true},
  {t:'Confío en mi nivel aunque el resultado no me esté acompañando.', dim:'Confianza'},
  {t:'Busco superarme a mí mismo, no solo compararme con los demás.', dim:'Motivación'},
];
const OPCIONES=[
  {v:1,l:'Nunca'},{v:2,l:'Pocas veces'},{v:3,l:'A veces'},{v:4,l:'Casi siempre'},{v:5,l:'Siempre'},
];

let PASO=0;
let RESPUESTAS=[];
const params=new URLSearchParams(window.location.search);
const LIBRO=params.get('libro')||'Dale Like a Tu Sueño';

function render(){
  const app=document.getElementById('app');
  if(PASO===0) return renderIntro(app);
  if(PASO>=1 && PASO<=PREGUNTAS.length) return renderPregunta(app, PASO-1);
  if(PASO===PREGUNTAS.length+1) return renderResultado(app);
  if(PASO===PREGUNTAS.length+2) return renderForm(app);
}

function renderIntro(app){
  app.innerHTML=`
    <div class="brand"><div class="brand-mark">⚡</div><div class="brand-text">SPORT COACHING<span class="brand-dot"></span>360</div></div>
    <div class="libro-tag">📖 Llegaste desde <strong style="color:var(--ink)">"${LIBRO}"</strong></div>
    <h1>¿Sabés cuán <em>disponible</em> estás para competir?</h1>
    <div class="sub">El deporte entrena el físico con datos todos los días. El rendimiento mental, casi nunca. Te dejamos 5 preguntas de muestra del Modelo de Disponibilidad Competitiva (MDC) — la metodología que usan hoy clubes como Godoy Cruz o Club Deportivo Maipú.</div>
    <button class="cta" onclick="PASO=1;render()">Empezar (2 min)</button>
  `;
}

function renderPregunta(app, i){
  const pr=PREGUNTAS[i];
  const barras=PREGUNTAS.map(function(_,idx){return '<div class="'+(idx<PASO?'on':'')+'"></div>';}).join('');
  app.innerHTML=`
    <div class="brand"><div class="brand-mark">⚡</div><div class="brand-text">SPORT COACHING<span class="brand-dot"></span>360</div></div>
    <div class="progreso">${barras}</div>
    <div class="pregunta">${pr.t}</div>
    <div class="escala">
      ${OPCIONES.map(function(o){return '<div class="op" onclick="responder('+o.v+')">'+o.l+'</div>';}).join('')}
    </div>
  `;
}

function responder(v){
  const i=PASO-1;
  const val=PREGUNTAS[i].inv ? (6-v) : v;
  RESPUESTAS[i]=val;
  PASO++;
  render();
}

function renderResultado(app){
  const prom=RESPUESTAS.reduce(function(a,b){return a+b;},0)/RESPUESTAS.length;
  const pct=Math.round((prom/5)*100);
  const R=76, C=2*Math.PI*R;
  const offset=C*(1-pct/100);
  const color = pct>=70?'#22c55e':pct>=45?'#d4a830':'#ef4444';
  app.innerHTML=`
    <div class="brand"><div class="brand-mark">⚡</div><div class="brand-text">SPORT COACHING<span class="brand-dot"></span>360</div></div>
    <h1 style="font-size:20px;text-align:center">Tu adelanto de Disponibilidad</h1>
    <div class="resultado-ring">
      <svg viewBox="0 0 170 170">
        <circle class="track" cx="85" cy="85" r="${R}"/>
        <circle class="fill" cx="85" cy="85" r="${R}" stroke="${color}" stroke-dasharray="${C}" stroke-dashoffset="${offset}"/>
      </svg>
      <div class="resultado-num"><div class="n" style="color:${color}">${pct}%</div><div class="l">DISPONIBLE</div></div>
    </div>
    <div class="adelanto">Esto es solo un adelanto con 5 preguntas de muestra. El MDC real mide <strong>12 dimensiones con 42 preguntas</strong>, cruzado con perfil DISC, seguimiento partido a partido y entrenamiento cognitivo — para vos y para todo tu plantel.</div>
    <button class="cta" onclick="PASO++;render()">Quiero esto para mi club →</button>
  `;
}

function renderForm(app){
  app.innerHTML=`
    <div class="brand"><div class="brand-mark">⚡</div><div class="brand-text">SPORT COACHING<span class="brand-dot"></span>360</div></div>
    <h1 style="font-size:21px">Dejanos tus datos</h1>
    <div class="sub">Te contactamos en menos de 24hs para mostrarte SC360 aplicado a tu club.</div>

    <label>Tu nombre</label>
    <input type="text" id="f-nombre" placeholder="Nombre y apellido">
    <label>Club / institución</label>
    <input type="text" id="f-club" placeholder="Nombre del club">
    <label>Tu cargo</label>
    <input type="text" id="f-cargo" placeholder="DT, coordinador, dirigente...">
    <label>WhatsApp</label>
    <input type="text" id="f-wa" placeholder="Con código de área">

    <button class="cta" id="btn-enviar" style="margin-top:22px" onclick="enviarLead()">Enviar</button>
    <div class="footer-nota">Tus datos quedan solo para que el equipo de Sport Coaching 360 te contacte.</div>
  `;
}

async function enviarLead(){
  const nombre=document.getElementById('f-nombre').value.trim();
  const club=document.getElementById('f-club').value.trim();
  const cargo=document.getElementById('f-cargo').value.trim();
  const wa=document.getElementById('f-wa').value.trim();
  if(!nombre||!club||!wa){ alert('Completá al menos nombre, club y WhatsApp.'); return; }

  const btn=document.getElementById('btn-enviar');
  btn.disabled=true; btn.textContent='Enviando...';

  const prom=RESPUESTAS.length?RESPUESTAS.reduce(function(a,b){return a+b;},0)/RESPUESTAS.length:null;
  const pct=prom?Math.round((prom/5)*100):null;

  const res=await q('crm_clubes',{m:'POST',b:{
    nombre:club,
    contacto_nombre:nombre,
    contacto_cargo:cargo||null,
    contacto_wa:wa,
    fuente:'libro_qr',
    estado:'nuevo',
    pais:'Argentina',
    notas:'Vino del QR del libro "'+LIBRO+'". Demo de muestra: '+(pct!=null?pct+'% disponibilidad':'sin completar')+'.',
  },h:{'Prefer':'return=minimal'}});

  // El WhatsApp es la red de respaldo: se manda SIEMPRE, incluso si el
  // guardado en el CRM falla — así el lead nunca se pierde del todo. Si
  // el guardado falló, se lo marcamos en el propio mensaje para que se
  // cargue a mano en el CRM en vez de perderse en silencio.
  const guardadoOk = !(res && res.__error);
  const msg=encodeURIComponent('¡Hola! Soy '+nombre+' de '+club+' ('+(cargo||'sin cargo')+'). Hice la demo de SC360 desde el libro "'+LIBRO+'" (me dio '+(pct!=null?pct+'% disponibilidad':'—')+') y quiero que me cuenten más para mi club. Mi WhatsApp: '+wa+(guardadoOk?'':'\n\n⚠️ No se guardó solo en el CRM — cargar a mano.'));
  window.open('https://wa.me/'+WA_EDUARDO+'?text='+msg,'_blank');

  const app=document.getElementById('app');
  app.innerHTML='<div class="ok"><div class="ic">✅</div><h1 style="text-align:center;font-size:22px">¡Listo, '+nombre.split(' ')[0]+'!</h1><div class="sub" style="text-align:center">Te vamos a contactar por WhatsApp en menos de 24hs.</div></div>';
}

render();
</script>
</body>
</html>
