<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Consentimiento — Sport Coaching 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0b0e14; --surface:#141822; --gold:#d4a830; --blue:#1E6FD9;
    --ink:#f5f1e8; --muted:#8a8f9c; --green:#22c55e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Oswald',Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}
  .page{width:100%;max-width:460px;padding:28px 22px 50px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
  .brand-mark{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:14px}
  .brand-text{font-size:11px;letter-spacing:0.12em;color:var(--muted)}
  h1{font-family:'Fraunces',serif;font-size:24px;font-weight:500;margin-bottom:10px;line-height:1.3}
  .sub{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:24px}
  .jugador-box{background:var(--surface);border-radius:14px;padding:16px 18px;margin-bottom:26px}
  .jugador-box .l{font-size:10.5px;color:var(--muted);letter-spacing:0.05em}
  .jugador-box .n{font-size:18px;font-weight:600;margin-top:2px}
  .explicacion{font-size:13px;color:#c8c3b6;line-height:1.6;margin-bottom:26px;background:var(--surface);border-left:3px solid var(--blue);padding:14px 16px;border-radius:0 10px 10px 0}
  label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;margin-top:16px}
  input[type=text]{width:100%;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid #262c3a;color:var(--ink);font-family:'Oswald',sans-serif;font-size:14px}
  input[type=text]:focus{outline:none;border-color:var(--gold)}
  .radio-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .radio-opt{flex:1;min-width:90px;text-align:center;padding:10px 8px;border-radius:9px;background:var(--surface);border:1px solid #262c3a;font-size:12.5px;cursor:pointer}
  .radio-opt.sel{border-color:var(--gold);background:#d4a83015;color:var(--gold)}
  .check-box{display:flex;gap:12px;align-items:flex-start;margin-top:26px;background:var(--surface);padding:16px;border-radius:12px;cursor:pointer}
  .check-box input{width:20px;height:20px;flex-shrink:0;margin-top:2px}
  .check-box span{font-size:13px;line-height:1.5}
  .cta{display:block;width:100%;text-align:center;margin-top:22px;padding:16px;border-radius:12px;background:var(--gold);color:#1a1305;font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;border:none;cursor:pointer}
  .cta:disabled{opacity:0.4;cursor:not-allowed}
  .ok{text-align:center;padding:60px 20px}
  .ok .ic{font-size:52px;margin-bottom:16px}
  .err{text-align:center;padding:60px 24px;color:#e8a8a8;line-height:1.6}
</style>
</head>
<body>
<div class="page" id="app"><div style="text-align:center;padding:80px 20px;color:var(--muted)">Cargando...</div></div>

<script>
const SB_URL='https://gltqhcnusblfovhxljcs.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdsdHFoY251c2JsZm92aHhsamNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NzM4NDQsImV4cCI6MjA5MTI0OTg0NH0.FrRzvRzz0k4b3jgHpGsxA10enM9AuSSXTPo7PAgVAXI';

async function q(path,opts){
  try{
    const r=await fetch(SB_URL+'/rest/v1/'+path,{
      method:(opts&&opts.m)||'GET',
      headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json',
        'Prefer':(opts&&opts.h&&opts.h.Prefer)||'return=representation'},
      body:(opts&&opts.b)?JSON.stringify(opts.b):undefined,
    });
    const t=await r.text();
    if(!r.ok){ console.error('Error request:',t); return null; }
    return t?JSON.parse(t):null;
  }catch(e){ console.error('Error de red:',e); return null; }
}

let VINCULO='';
function elegirVinculo(v){
  VINCULO=v;
  document.querySelectorAll('.radio-opt').forEach(function(el){ el.classList.toggle('sel', el.dataset.v===v); });
  validar();
}
function validar(){
  const nombre=document.getElementById('f-nombre').value.trim();
  const check=document.getElementById('f-check').checked;
  document.getElementById('btn-enviar').disabled = !(nombre && VINCULO && check);
}

async function init(){
  const app=document.getElementById('app');
  const params=new URLSearchParams(window.location.search);
  const token=params.get('token');
  if(!token){
    app.innerHTML='<div class="err">Este link no es válido.<br>Pedile al club que te lo reenvíe.</div>';
    return;
  }
  let data=await q('resultados?token_perfil=eq.'+token+'&limit=1&select=id,jugador_nombre,jugador_club');
  if(!data||!data.length) data=await q('resultados?id=eq.'+token+'&limit=1&select=id,jugador_nombre,jugador_club');
  if(!data||!data.length){
    app.innerHTML='<div class="err">No encontramos el perfil asociado a este link.<br>Pedile al club que te lo reenvíe.</div>';
    return;
  }
  const r=data[0];

  app.innerHTML=`
    <div class="brand">
      <div class="brand-mark">⚡</div>
      <div class="brand-text">SPORT COACHING 360</div>
    </div>
    <h1>Autorización para usar la plataforma</h1>
    <div class="sub">Antes de que ${(r.jugador_nombre||'tu hijo/a').split(' ')[0]} empiece a usar Sport Coaching 360, necesitamos tu autorización.</div>

    <div class="jugador-box">
      <div class="l">DEPORTISTA</div>
      <div class="n">${r.jugador_nombre||'—'}</div>
      ${r.jugador_club?'<div class="l" style="margin-top:6px">'+r.jugador_club+'</div>':''}
    </div>

    <div class="explicacion">
      Sport Coaching 360 mide y entrena el rendimiento mental deportivo. Esto incluye un test inicial, seguimiento después de cada partido/entreno, ejercicios cognitivos, y algunos datos de contexto (familiar, social, económico) que el club puede pedir para acompañar mejor. Solo lo ve el cuerpo técnico y coordinación del club.
    </div>

    <label>Tu nombre completo</label>
    <input type="text" id="f-nombre" placeholder="Nombre y apellido" oninput="validar()">

    <label>Tu vínculo con ${(r.jugador_nombre||'el/la deportista').split(' ')[0]}</label>
    <div class="radio-group">
      <div class="radio-opt" data-v="madre" onclick="elegirVinculo('madre')">Madre</div>
      <div class="radio-opt" data-v="padre" onclick="elegirVinculo('padre')">Padre</div>
      <div class="radio-opt" data-v="tutor_legal" onclick="elegirVinculo('tutor_legal')">Tutor/a legal</div>
      <div class="radio-opt" data-v="otro" onclick="elegirVinculo('otro')">Otro</div>
    </div>

    <label class="check-box" for="f-check">
      <input type="checkbox" id="f-check" onchange="validar()">
      <span>Autorizo el uso de Sport Coaching 360 para ${r.jugador_nombre||'este deportista'}, incluyendo la carga de la información descripta arriba.</span>
    </label>

    <button class="cta" id="btn-enviar" disabled onclick="enviar('${r.jugador_nombre?r.jugador_nombre.replace(/'/g,"\\'"):''}','${(r.jugador_club||'').replace(/'/g,"\\'")}')">Confirmar autorización</button>
  `;
}

async function enviar(jugadorNombre, clubNombre){
  const btn=document.getElementById('btn-enviar');
  btn.disabled=true; btn.textContent='Enviando...';

  const body={
    jugador_nombre: jugadorNombre,
    club_nombre: clubNombre||null,
    autorizado: true,
    tutor_nombre: document.getElementById('f-nombre').value.trim(),
    vinculo_tutor: VINCULO,
    medio: 'formulario_digital',
    fecha_consentimiento: new Date().toISOString().slice(0,10),
    user_agent: navigator.userAgent,
    actualizado_en: new Date().toISOString(),
  };

  const res=await q('consentimientos?on_conflict=jugador_nombre',{
    m:'POST', b:body, h:{'Prefer':'resolution=merge-duplicates,return=minimal'}
  });

  const app=document.getElementById('app');
  if(res===null){
    app.innerHTML='<div class="ok"><div class="ic">✅</div><h1 style="text-align:center">¡Listo!</h1><div class="sub" style="text-align:center">Tu autorización quedó registrada. Gracias.</div></div>';
  } else {
    btn.disabled=false; btn.textContent='Confirmar autorización';
    alert('Hubo un problema al guardar. Probá de nuevo en un momento.');
    console.error('Error guardando consentimiento:',res);
  }
}

init();
</script>
</body>
</html>
