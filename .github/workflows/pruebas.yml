# Corre las pruebas automáticas cada vez que se sube un cambio.
# Si algo falla, GitHub te manda un mail y la marca roja aparece en el commit.
name: Pruebas SC360
on:
  push:
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
