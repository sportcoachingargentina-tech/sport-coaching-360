<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Mente Competitiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0b0e14;
    --surface:#141822;
    --gold:#d4a830;
    --gold-soft:#d4a83022;
    --blue:#1E6FD9;
    --ink:#f5f1e8;
    --muted:#8a8f9c;
    --dim:#4b5160;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-tap-highlight-color:transparent}
  body{
    background:radial-gradient(ellipse 120% 70% at 50% -10%, #1a2030 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:'Oswald',Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .page{width:100%;max-width:430px;min-height:100vh;padding:28px 22px 40px;display:flex;flex-direction:column}

  .brand{display:flex;align-items:center;gap:10px;margin-bottom:34px}
  .brand-mark{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:14px}
  .brand-text{font-size:11px;letter-spacing:0.14em;color:var(--muted);font-weight:500}
  .brand-text b{color:var(--ink);font-weight:600}

  .greeting{font-size:26px;font-weight:600;letter-spacing:0.01em;margin-bottom:2px}
  .greeting-sub{font-family:'Fraunces',serif;font-style:italic;font-size:14px;color:var(--muted);margin-bottom:36px}

  /* Racha — el momento visual principal de la pantalla */
  .racha-wrap{display:flex;justify-content:center;margin-bottom:14px}
  .racha-ring{position:relative;width:180px;height:180px}
  .racha-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .racha-ring .track{fill:none;stroke:#1f2430;stroke-width:8}
  .racha-ring .fill{fill:none;stroke:var(--gold);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s ease}
  .racha-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .racha-num .n{font-size:52px;font-weight:700;line-height:1;color:var(--ink)}
  .racha-num .l{font-size:11px;color:var(--muted);letter-spacing:0.05em;margin-top:4px}
  .racha-caption{text-align:center;font-size:13px;color:var(--muted);margin-bottom:8px;line-height:1.5}
  .racha-caption b{color:var(--gold);font-weight:600}

  .dias{display:flex;justify-content:center;gap:9px;margin:20px 0 38px}
  .dia{display:flex;flex-direction:column;align-items:center;gap:6px}
  .dia .dot{width:10px;height:10px;border-radius:50%;background:#232838;border:1px solid #2c3244}
  .dia .dot.on{background:var(--gold);border-color:var(--gold)}
  .dia .dot.today{box-shadow:0 0 0 3px var(--gold-soft)}
  .dia .lbl{font-size:9px;color:var(--dim);letter-spacing:0.04em}

  /* CTA principal */
  .cta{
    display:block;text-align:center;text-decoration:none;
    background:var(--gold);color:#1a1305;
    font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;letter-spacing:0.01em;
    padding:19px;border-radius:16px;margin-bottom:14px;
    box-shadow:0 10px 26px -8px #d4a83066;
  }
  .cta:active{transform:scale(0.98)}
  .cta-sub{text-align:center;font-size:11.5px;color:var(--muted);margin-bottom:34px}

  /* Insight de la semana — tratamiento tipográfico, no una caja más */
  .insight{padding:22px 4px 6px;border-top:1px solid #1f2430;margin-top:auto}
  .insight-label{font-size:11px;color:var(--dim);letter-spacing:0.04em;margin-bottom:12px}
  .insight-text{font-family:'Fraunces',serif;font-size:19px;line-height:1.45;color:#e9e4d8;font-weight:400}
  .insight-text em{color:var(--gold);font-style:italic}

  .cargando{text-align:center;padding:80px 20px;color:var(--muted);font-size:13px}
  .err{text-align:center;padding:40px 24px;color:#e8a8a8;font-size:13px;background:var(--surface);border-radius:14px;margin-top:60px;line-height:1.6}
</style>
</head>
<body>
<div class="page" id="app"><div class="cargando">Cargando...</div></div>

<script>
const SB_URL='https://gltqhcnusblfovhxljcs.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdsdHFoY251c2JsZm92aHhsamNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NzM4NDQsImV4cCI6MjA5MTI0OTg0NH0.FrRzvRzz0k4b3jgHpGsxA10enM9AuSSXTPo7PAgVAXI';

async function q(path,opts){
  try{
    const r=await fetch(SB_URL+'/rest/v1/'+path,{
      method:(opts&&opts.m)||'GET',
      headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json',
        'Prefer':(opts&&opts.h&&opts.h.Prefer)||'return=representation'},
      body:(opts&&opts.b)?JSON.stringify(opts.b):undefined,
    });
    const t=await r.text();
    if(!r.ok){ console.error('Error request:',t); return null; }
    return t?JSON.parse(t):null;
  }catch(e){ console.error('Error de red:',e); return null; }
}

const COG_LABELS={
  reaccion_simple:'tu tiempo de reacción', go_nogo:'Go / No-Go', stroop:'el Stroop',
  memoria_trabajo:'tu memoria de trabajo', apuesta_confianza:'la Apuesta de Confianza', resistencia:'Resistencia',
};

function fechaKey(d){ return new Date(d).toISOString().slice(0,10); }

async function init(){
  const app=document.getElementById('app');
  const params=new URLSearchParams(window.location.search);
  const token=params.get('token');
  if(!token){
    app.innerHTML='<div class="err">Este link no es válido.<br>Pedile a tu profe que te lo reenvíe.</div>';
    return;
  }

  const selectCampos='id,jugador_nombre';
  let data=await q('resultados?token_perfil=eq.'+token+'&limit=1&select='+selectCampos);
  if(!data||!data.length) data=await q('resultados?id=eq.'+token+'&limit=1&select='+selectCampos);
  if(!data||!data.length){
    app.innerHTML='<div class="err">No encontramos tu perfil.<br>Pedile a tu profe que te lo reenvíe.</div>';
    return;
  }
  const r=data[0];
  const nombreCorto=(r.jugador_nombre||'').trim().split(' ')[0]||'';
  const nombreEsc=encodeURIComponent((r.jugador_nombre||'').trim());
  const hace30=new Date(Date.now()-30*86400000);

  const [ppRaw,cogRaw]=await Promise.all([
    q('entreno_jugador?jugador_nombre=ilike.'+nombreEsc+'&order=creado_en.desc&limit=60'),
    q('ejercicios_cognitivos?or=(jugador_id.eq.'+r.id+',jugador_nombre.ilike.'+nombreEsc+')&order=creado_en.desc&limit=60'),
  ]);
  const ppRows=(ppRaw||[]).filter(c=>c.creado_en && new Date(c.creado_en)>=hace30);
  const cogRows=(cogRaw||[]).filter(c=>c.creado_en && new Date(c.creado_en)>=hace30);

  // Días con actividad (check-in de entreno o ejercicio cognitivo cuentan igual)
  const diasActivos=new Set();
  ppRows.forEach(c=>diasActivos.add(fechaKey(c.creado_en)));
  cogRows.forEach(c=>diasActivos.add(fechaKey(c.creado_en)));

  // Racha — días consecutivos hasta hoy (se permite que hoy todavía esté vacío)
  let racha=0;
  for(let i=0;i<60;i++){
    const d=new Date(Date.now()-i*86400000);
    const key=fechaKey(d);
    if(diasActivos.has(key)) racha++;
    else if(i===0) continue; // hoy puede estar vacío sin cortar la racha
    else break;
  }

  const pct=Math.min(racha/14,1);
  const R=78, C=2*Math.PI*R;
  const offset=C*(1-pct);

  // Últimos 7 días, para el calendario de puntos
  const nombresDia=['D','L','M','M','J','V','S'];
  let dias='';
  for(let i=6;i>=0;i--){
    const d=new Date(Date.now()-i*86400000);
    const on=diasActivos.has(fechaKey(d));
    dias+='<div class="dia"><div class="dot'+(on?' on':'')+(i===0?' today':'')+'"></div><div class="lbl">'+nombresDia[d.getDay()]+'</div></div>';
  }

  const insight=armarInsight(ppRows,cogRows,racha);

  app.innerHTML=`
    <div class="brand">
      <div class="brand-mark">⚡</div>
      <div class="brand-text"><b>Mente Competitiva</b> · Entrenamiento mental</div>
    </div>
    <div class="greeting">Hola, ${nombreCorto}</div>
    <div class="greeting-sub">Tu cabeza también se entrena.</div>

    <div class="racha-wrap">
      <div class="racha-ring">
        <svg viewBox="0 0 180 180">
          <circle class="track" cx="90" cy="90" r="${R}"/>
          <circle class="fill" cx="90" cy="90" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${offset}"/>
        </svg>
        <div class="racha-num">
          <div class="n">${racha}</div>
          <div class="l">${racha===1?'día seguido':'días seguidos'}</div>
        </div>
      </div>
    </div>
    <div class="racha-caption">${cap(racha)}</div>

    <div class="dias">${dias}</div>

    <a class="cta" href="jugador.html?token=${encodeURIComponent(token)}&entrenar=1">Empezar tu entrenamiento de hoy</a>
    <div class="cta-sub">2 a 5 minutos. Se guarda solo.</div>

    <div class="insight">
      <div class="insight-label">Esta semana</div>
      <div class="insight-text">${insight}</div>
    </div>
  `;
}

function cap(racha){
  if(racha===0) return 'Arrancá hoy — el primer día siempre cuenta doble.';
  if(racha<3) return 'Vas arrancando. <b>Sostenelo dos días más</b> y ya es un hábito.';
  if(racha<7) return 'Se nota la constancia. Así se entrena la cabeza.';
  if(racha<14) return '<b>Una semana entera.</b> Esto ya es tuyo.';
  return '<b>Constancia real.</b> Pocos llegan hasta acá.';
}

// Une la señal de Post Entreno (check-in físico/mental) con la de
// entrenamiento cognitivo en UNA sola frase, en tono humano — no un
// reporte con dos secciones. Prioriza la noticia más positiva o más
// concreta disponible; si no hay nada todavía, invita a empezar.
function armarInsight(ppRows,cogRows,racha){
  function avgPP(rec){
    const vals=['m1','m2','m3','m4','m5','m6'].map(k=>rec[k]).filter(v=>v!=null);
    return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
  }
  const ppOrdenado=ppRows.slice().sort((a,b)=>new Date(b.creado_en)-new Date(a.creado_en));
  let fraseEntreno=null;
  if(ppOrdenado.length>=2){
    const u=avgPP(ppOrdenado[0]), p=avgPP(ppOrdenado[1]);
    if(u!=null&&p!=null){
      const diff=u-p;
      if(diff>0.8) fraseEntreno='Tu último check-in mostró <em>mejor concentración y confianza</em> que el anterior.';
      else if(diff<-0.8) fraseEntreno='Bajaste un poco en tu último check-in — pasa, y es información, no una condena.';
    }
  } else if(ppOrdenado.length===1){
    fraseEntreno='Cargaste tu primer check-in de entreno. A partir de ahora, cada uno cuenta una historia más.';
  }

  const porTipo={};
  cogRows.forEach(c=>{ if(!porTipo[c.tipo]) porTipo[c.tipo]=[]; porTipo[c.tipo].push(c); });
  let fraseCog=null;
  Object.keys(porTipo).forEach(tipo=>{
    const arr=porTipo[tipo].sort((a,b)=>new Date(b.creado_en)-new Date(a.creado_en));
    if(arr.length<2) return;
    const nuevo=arr[0], viejo=arr[1];
    if(nuevo.promedio_ms!=null&&viejo.promedio_ms!=null&&viejo.promedio_ms-nuevo.promedio_ms>15 && !fraseCog){
      fraseCog=`Mejoraste ${COG_LABELS[tipo]||tipo} respecto a tu intento anterior.`;
    }
  });

  if(fraseEntreno && fraseCog) return fraseEntreno+' Y en lo cognitivo: '+fraseCog.charAt(0).toLowerCase()+fraseCog.slice(1);
  if(fraseCog) return fraseCog;
  if(fraseEntreno) return fraseEntreno;
  if(racha>0) return 'Todavía no hay suficientes datos para ver tendencia — con un par de cargas más, esto va a empezar a contarte algo.';
  return 'Tu primer entrenamiento de hoy es el punto de partida. <em>Todo lo demás se construye desde ahí.</em>';
}

init();
</script>
</body>
</html>
